<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessions — Sally</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('sally-theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="assets/sally.css">
<style>
  body{height:100vh; display:flex; flex-direction:column; overflow:hidden}

  /* ================= HUB — sessions as 2x2 widgets ================= */
  #hub{flex:1; overflow-y:auto}
  .sess-grid{display:grid; grid-template-columns:repeat(auto-fill,344px); gap:24px; justify-content:start; padding-bottom:40px}
  .scard{width:344px; height:344px; padding:22px; display:flex; flex-direction:column; cursor:pointer; position:relative}
  .scard .s-kind{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px;
    display:flex; align-items:center; gap:7px}
  .scard .s-kind i{font-size:13px; color:var(--accent)}
  .scard h3{font-size:20px; font-weight:600; letter-spacing:-0.018em; line-height:1.22; padding-right:30px}
  .scard .s-last{margin-top:14px; flex:1; min-height:0; overflow:hidden}
  .scard .s-last .ln{display:flex; gap:9px; margin-bottom:10px}
  .scard .s-last .pav{width:22px;height:22px; font-size:8.5px; margin-top:1px}
  .scard .s-last .pav.ai{font-size:11px}
  .scard .s-last .t{font-size:13px; line-height:1.5; color:var(--text-secondary); min-width:0;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .scard .s-last .t b{color:var(--text-primary); font-weight:600}
  .scard .s-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline)}
  .scard .s-meta{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--text-tertiary); white-space:nowrap}
  .scard .pin{position:absolute; top:16px; right:16px; width:30px;height:30px;border-radius:9px; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; color:var(--text-tertiary);
    border:1px solid var(--border); background:rgba(255,255,255,0.04); opacity:0; transition:.18s var(--ease)}
  .scard:hover .pin{opacity:1}
  .scard .pin:hover{color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft)}
  .scard .pin.on{opacity:1; color:var(--good); border-color:rgba(50,215,75,.4); background:rgba(50,215,75,.10)}
  .scard.new{border-style:dashed; align-items:center; justify-content:center; gap:12px; color:var(--text-tertiary); background:transparent}
  .scard.new i{font-size:30px}
  .scard.new span{font-size:14px; font-weight:500}
  .scard.new:hover{color:var(--accent); border-color:var(--accent-line)}
  @keyframes scardIn{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
  .scard.enter{animation:scardIn .5s var(--ease) backwards}
  @media (max-width:780px){ .sess-grid{grid-template-columns:1fr} .scard{width:100%; height:auto; min-height:250px} }
  @media (hover:none){ .scard .pin{opacity:1} }

  /* ================= CHAT STAGE ================= */
  .stage{flex:1; display:grid; grid-template-columns:1fr 372px; min-height:0; position:relative; z-index:1;
    padding-left:calc(var(--dock-width) + var(--dock-margin)*2)}
  .chat{display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--border)}
  .chat-head{padding:14px 22px 13px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:13px}
  .chat-head .back{width:34px;height:34px;border-radius:10px; flex:none; cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center; color:var(--text-secondary);
    border:1px solid var(--border); background:rgba(255,255,255,0.03); transition:.16s var(--ease)}
  .chat-head .back:hover{color:var(--text-primary); border-color:var(--border-2); transform:translateX(-1px)}
  .chat-head .tt{min-width:0}
  .chat-head h1{font-size:17px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chat-head .ss{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-tertiary); margin-top:2px}
  .chat-head .spacer{flex:1}
  .chat-head .hpin{display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
    font-size:12px; font-weight:500; color:var(--text-secondary); padding:7px 12px; border-radius:10px;
    border:1px solid var(--border); background:rgba(255,255,255,0.03); transition:.16s var(--ease)}
  .chat-head .hpin:hover{color:var(--accent); border-color:var(--accent-line)}
  .chat-head .hpin.on{color:var(--good); border-color:rgba(50,215,75,.4); background:rgba(50,215,75,.08)}

  .thread{flex:1; overflow-y:auto; padding:22px 0}
  .thread .wrap{max-width:860px; margin:0 auto; padding:0 14px}

  /* ---- Discord-style group messages ---- */
  .gmsg{position:relative; display:flex; gap:13px; padding:7px 16px; border-radius:12px; animation:rise .35s var(--ease) both}
  @keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  .gmsg:hover{background:rgba(255,255,255,0.03)}
  [data-theme="light"] .gmsg:hover{background:rgba(0,0,0,0.03)}
  .gmsg.flash{background:var(--accent-soft)}
  .gmsg .gav{width:38px;height:38px;border-radius:50%; flex:none; margin-top:3px; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#fff; box-shadow:0 1px 5px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.14) inset}
  .gmsg .gav.ai{background:linear-gradient(140deg,var(--accent-2),var(--accent)); font-size:17px}
  .gmsg .gmain{flex:1; min-width:0}
  .gmsg .ghead{display:flex; align-items:baseline; gap:9px}
  .gmsg .gname{font-size:14.5px; font-weight:600; letter-spacing:-.005em}
  .gmsg .gtime{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; color:var(--text-tertiary)}
  .gmsg .gbody{font-size:15px; line-height:1.55; color:var(--text-primary); margin-top:2px; word-wrap:break-word}
  .gmsg .gbody p{margin:0 0 9px} .gmsg .gbody p:last-child{margin:0}

  /* reply reference (quoted message above the header, Discord-style) */
  .gref{display:flex; align-items:center; gap:7px; margin:0 0 4px; font-size:12px; color:var(--text-tertiary); cursor:pointer; min-width:0}
  .gref:hover .gq{color:var(--text-secondary)}
  .gref .elbow{width:22px; height:10px; flex:none; margin-left:8px;
    border-left:2px solid var(--border-2); border-top:2px solid var(--border-2); border-top-left-radius:7px; margin-top:9px}
  .gref .pav{width:17px;height:17px; font-size:7px}
  .gref .pav.ai{font-size:9px}
  .gref .rn{font-weight:600; flex:none}
  .gref .gq{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}

  /* hover actions */
  .gact{position:absolute; top:-12px; right:18px; display:none; gap:2px; padding:3px;
    background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-1)}
  .gmsg:hover .gact{display:flex}
  .gact button{width:28px;height:28px;border-radius:7px; border:0; background:transparent; cursor:pointer;
    color:var(--text-secondary); font-size:15px; display:flex; align-items:center; justify-content:center; transition:.14s}
  .gact button:hover{background:rgba(128,128,128,.16); color:var(--text-primary)}

  .typing{display:inline-flex; gap:5px; padding:6px 2px; align-items:center}
  .typing i{width:7px;height:7px;border-radius:50%; background:var(--accent); opacity:.5; animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3; transform:translateY(0)} 30%{opacity:1; transform:translateY(-3px)}}

  /* day-style divider for seeded history */
  .gdiv{display:flex; align-items:center; gap:12px; margin:14px 16px; color:var(--text-tertiary);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase}
  .gdiv::before,.gdiv::after{content:""; flex:1; height:1px; background:var(--hairline)}

  /* suggested prompts */
  .suggest{padding:0 0 12px}
  .suggest .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px}
  .suggest .chips{display:flex; gap:8px; flex-wrap:wrap}
  .qchip{cursor:pointer; transition:.15s var(--ease)}
  .qchip:hover{color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line)}

  /* composer + reply bar */
  .composer{border-top:1px solid var(--border); padding:14px 0 16px}
  .composer .wrap{max-width:860px; margin:0 auto; padding:0 30px}
  .replybar{display:none; align-items:center; gap:9px; padding:9px 14px; font-size:12.5px; color:var(--text-secondary);
    background:rgba(255,255,255,0.045); border:1px solid var(--glass-border); border-bottom:0; border-radius:14px 14px 0 0}
  [data-theme="light"] .replybar{background:rgba(0,0,0,0.03)}
  .replybar.on{display:flex}
  .replybar i.ri-reply-line{color:var(--accent); flex:none}
  .replybar .rb-name{font-weight:600; flex:none}
  .replybar .rb-snip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; color:var(--text-tertiary)}
  .replybar .rb-x{margin-left:auto; flex:none; width:24px;height:24px;border-radius:7px; border:0; cursor:pointer; font-size:15px;
    background:transparent; color:var(--text-tertiary); display:flex; align-items:center; justify-content:center}
  .replybar .rb-x:hover{color:var(--text-primary); background:rgba(128,128,128,.15)}
  .composer .box{display:flex; gap:10px; align-items:flex-end; background:var(--glass-bg);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--glass-border); box-shadow:0 1px 0 var(--glass-hi) inset;
    border-radius:16px; padding:8px 8px 8px 16px; transition:.16s var(--ease)}
  .replybar.on + .box{border-top-left-radius:0; border-top-right-radius:0}
  .composer .box:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .composer textarea{flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text-primary);
    font-family:var(--font); font-size:15px; line-height:1.5; max-height:120px; padding:7px 0}
  .composer textarea::placeholder{color:var(--text-tertiary)}
  .send{width:40px;height:40px;border-radius:11px; border:0; cursor:pointer; flex:none;
    background:linear-gradient(140deg,var(--accent-2),var(--accent)); color:#fff; display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px -10px var(--accent); transition:.15s var(--ease)}
  .send:hover{filter:brightness(1.1); transform:translateY(-1px)} .send:disabled{opacity:.4; cursor:default; filter:none; transform:none}
  .send i{font-size:20px}
  .composer .hint{font-family:var(--mono); font-size:9.5px; color:var(--text-tertiary); margin-top:9px; text-align:center; letter-spacing:.04em}

  /* ---- sources rail ---- */
  .rail{display:flex; flex-direction:column; min-height:0; background:rgba(20,20,22,0.38);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%)}
  [data-theme="light"] .rail{background:rgba(255,255,255,0.34)}
  .rail .rh{padding:20px 22px 14px; border-bottom:1px solid var(--border)}
  .rail .rh .t{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .rail .rh .s{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-tertiary); margin-top:5px}
  .rail .list{flex:1; overflow-y:auto; padding:18px 16px 22px}
  .srccard{border:1px solid var(--glass-border); border-radius:var(--radius-sm); padding:14px; margin-bottom:14px;
    background:var(--glass-bg); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 1px 0 var(--glass-hi) inset, var(--shadow-1); transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
    position:relative; cursor:pointer}
  .srccard:hover{transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--accent-line)}
  .srccard .num{position:absolute; top:-9px; left:13px; min-width:20px;height:20px;padding:0 5px;border-radius:6px;
    background:linear-gradient(140deg,var(--accent-2),var(--accent)); color:#fff; font-family:var(--mono); font-size:10px; font-weight:600;
    display:flex;align-items:center;justify-content:center; box-shadow:0 4px 12px -4px var(--accent)}
  .srccard.flash{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .srccard .nm{font-family:var(--font); font-weight:600; font-size:14px; color:var(--text-primary); margin:4px 0 3px; padding-right:8px; line-height:1.3}
  .srccard .meta{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px}
  .srccard .snip{font-size:12.5px; color:var(--text-secondary); line-height:1.55; border-left:2px solid var(--accent-line); padding-left:11px}
  .srccard .pips{display:flex; gap:5px; margin-top:11px}
  .srccard .pips i{width:9px;height:9px;border-radius:50%}
  .rail .empty{padding:40px 22px; color:var(--text-tertiary); font-size:13px; text-align:center; line-height:1.6}
  .rail .empty .ic{width:44px;height:44px;margin:0 auto 14px; border-radius:12px; border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center; color:var(--text-tertiary); font-size:22px}

  /* AI / offline mode pill */
  .mode-pill{display:inline-flex; align-items:center; gap:6px; cursor:pointer; flex:none;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    padding:5px 10px; border-radius:999px; border:1px solid var(--border); color:var(--text-secondary);
    background:rgba(255,255,255,0.03); transition:.16s var(--ease)}
  .mode-pill .d{width:7px;height:7px;border-radius:50%; background:var(--warn); flex:none}
  .mode-pill.on .d{background:var(--good)}
  .mode-pill:hover{border-color:var(--accent-line); color:var(--accent)}

  /* citation trace popover */
  .citepop{position:fixed; z-index:500; max-width:330px; background:var(--bg-elev);
    border:1px solid var(--border-2); border-radius:13px; box-shadow:var(--shadow-2); padding:13px 15px;
    opacity:0; transform:translateY(5px); pointer-events:none; transition:.16s var(--ease)}
  .citepop.show{opacity:1; transform:translateY(0)}
  .citepop .pnm{font-weight:600; font-size:13px; margin-bottom:3px; color:var(--text-primary)}
  .citepop .pmeta{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:9px}
  .citepop .ptext{font-size:12.5px; color:var(--text-secondary); line-height:1.55; border-left:2px solid var(--accent-line); padding-left:10px}
  .citepop .ptrace{margin-top:11px; padding-top:9px; border-top:1px solid var(--hairline);
    font-family:var(--mono); font-size:9px; letter-spacing:.04em; color:var(--accent); display:flex; align-items:center; gap:6px}
  .cite.dim{opacity:.5}

  @media (max-width:880px){
    .stage{grid-template-columns:1fr; padding-left:0; padding-bottom:80px} .rail{display:none}
    .thread .wrap, .composer .wrap{padding:0 10px} .chat-head{padding:12px 14px}
    .chat-head .hpin span{display:none}
  }
</style>
</head>
<body>

<!-- ================= HUB ================= -->
<main class="shell" id="hub">
  <div class="inner">
    <div class="page-head">
      <div class="eyebrow accent">Team workspace</div>
      <h1>Sessions</h1>
      <div class="sub">Living conversations between your team and Sally — every thread grounded in the corpus, every claim cited. Pin a session to your personal dashboard to keep it one tap away.</div>
    </div>
    <div class="sess-grid" id="sessGrid"></div>
  </div>
</main>

<!-- ================= CHAT STAGE ================= -->
<div class="stage" id="stage" style="display:none">
  <section class="chat">
    <div class="chat-head">
      <button class="back" id="backBtn" title="All sessions"><i class="ri-arrow-left-line"></i></button>
      <div class="tt">
        <h1 id="sessTitle"></h1>
        <div class="ss" id="sessSub"></div>
      </div>
      <span class="spacer"></span>
      <span id="headStack"></span>
      <button class="hpin" id="headPin" title="Add to personal dashboard"><i class="ri-pushpin-line"></i><span>Add to dashboard</span></button>
      <span class="mode-pill" id="modePill" title="AI settings"></span>
    </div>
    <div class="thread" id="thread">
      <div class="wrap" id="threadInner"></div>
    </div>
    <div class="composer">
      <div class="wrap">
        <div class="suggest" id="suggest" style="display:none">
          <div class="lbl">Try asking</div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="replybar" id="replybar">
          <i class="ri-reply-line"></i>
          <span>Replying to</span><span class="rb-name" id="rbName"></span>
          <span class="rb-snip" id="rbSnip"></span>
          <button class="rb-x" id="rbX" title="Cancel reply"><i class="ri-close-line"></i></button>
        </div>
        <div class="box">
          <textarea id="input" rows="1" placeholder="Message…"></textarea>
          <button class="send" id="send" title="Send" aria-label="Send"><i class="ri-arrow-up-line"></i></button>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </div>
  </section>

  <aside class="rail">
    <div class="rh"><div class="t">Sources</div><div class="s" id="rcount">Citations appear here</div></div>
    <div class="list" id="sources"></div>
  </aside>
</div>

<script src="assets/corpus.js"></script>
<script src="assets/llm.js"></script>
<script src="assets/store.js"></script>
<script src="assets/sessions.js"></script>
<script>
Sally.mountDock("ask");
const company = Sally.company.name;
const S = Sally.Sessions, TEAM = Sally.TEAM;

/* ---------- DOM ---------- */
const hub        = document.getElementById("hub");
const stage      = document.getElementById("stage");
const sessGrid   = document.getElementById("sessGrid");
const thread     = document.getElementById("threadInner");
const threadScroll = document.getElementById("thread");
const sourcesEl  = document.getElementById("sources");
const rcount     = document.getElementById("rcount");
const input      = document.getElementById("input");
const send       = document.getElementById("send");
const suggestEl  = document.getElementById("suggest");
const replybar   = document.getElementById("replybar");

/* ---------- state ---------- */
let current = null;            // open session id
let msgs = [];                 // merged messages of the open session
let citeSeq = 0;               // global citation counter (per open session)
const srcMap = {};             // global num -> source object
let replying = null;           // message being replied to
let busy = false;

/* ---------- tiny helpers ---------- */
const wait = ms=>new Promise(r=>setTimeout(r,ms));
function scrollDown(){ threadScroll.scrollTop = threadScroll.scrollHeight; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function member(id){ return TEAM[id] || {id, name:id, color:"#8e8e93", initials:"?", role:""}; }

/* =========================================================================
   "Add to personal dashboard" — queued via store; the dashboard picks the
   widget up on next visit (template: session-card, 2x2).
   ========================================================================= */
function onDash(id){
  try{
    if((Sally.store.get("pendingWidgets",[])||[]).some(w=>w.session===id)) return true;
    const d=Sally.store.loadDash();
    return !!(d && d.boards && d.boards.some(b=> (b.widgets||[]).some(w=> w.template==="session-card" && w.session===id)));
  }catch(e){ return false; }
}
function addToDash(id){
  if(onDash(id)) return;
  const s=S.get(id); if(!s) return;
  const pend=Sally.store.get("pendingWidgets",[])||[];
  pend.push({ id:"w-sess-"+id, template:"session-card", dimension:"2x2", title:s.title, session:id });
  Sally.store.set("pendingWidgets", pend);
}

/* =========================================================================
   HUB — session cards in dashboard 2x2 widget format
   ========================================================================= */
function renderHub(){
  const cards = S.defs().map((s,i)=>{
    const last = S.lastMessage(s.id);
    const count = S.messages(s.id).length;
    const lm = last ? member(last.who) : null;
    const pinned = onDash(s.id);
    return `
    <div class="card link scard enter" data-id="${s.id}" style="animation-delay:${i*45}ms">
      <button class="pin ${pinned?'on':''}" data-pin="${s.id}" title="${pinned?'On your dashboard':'Add to personal dashboard'}">
        <i class="${pinned?'ri-pushpin-2-fill':'ri-pushpin-line'}"></i>
      </button>
      <div class="s-kind"><i class="ri-discuss-line"></i> Session</div>
      <h3>${escapeHtml(s.title)}</h3>
      <div class="s-last">${ last ? `
        <div class="ln">
          ${S.avatarHtml(last.who)}
          <div class="t"><b>${escapeHtml(lm.name)}:</b> ${escapeHtml(S.plain(last.text))}</div>
        </div>` : `<div class="t" style="color:var(--text-tertiary)">No messages yet.</div>`}
      </div>
      <div class="s-foot">
        ${S.stackHtml(s.members, 4)}
        <span class="s-meta">${count} message${count===1?"":"s"}${last?" · "+escapeHtml(last.time):""}</span>
      </div>
    </div>`;
  }).join("");
  sessGrid.innerHTML = cards + `
    <div class="card scard new enter" id="newSess" style="animation-delay:${S.defs().length*45}ms">
      <i class="ri-add-line"></i><span>New session</span>
    </div>`;

  sessGrid.querySelectorAll(".scard[data-id]").forEach(el=>{
    el.onclick = ()=> openSession(el.dataset.id);
  });
  sessGrid.querySelectorAll("[data-pin]").forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      addToDash(b.dataset.pin);
      b.classList.add("on"); b.innerHTML=`<i class="ri-pushpin-2-fill"></i>`; b.title="On your dashboard";
      if(b.animate) b.animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:280,easing:"ease"});
    };
  });
  document.getElementById("newSess").onclick = ()=>{
    const t=(prompt("Name this session","New session")||"").trim();
    if(!t) return;
    openSession(S.create(t));
  };
}

/* =========================================================================
   CHAT — Discord-style group thread
   ========================================================================= */
function clearRail(){
  citeSeq=0; for(const k in srcMap) delete srcMap[k];
  sourcesEl.innerHTML=`<div class="empty"><div class="ic"><i class="ri-file-text-line"></i></div>
    Sally cites the exact documents and passages behind every answer — hover a citation in the thread to trace it.</div>`;
  rcount.textContent="Citations appear here";
}

function openSession(id){
  const s=S.get(id); if(!s){ closeSession(); return; }
  current=id; replying=null; updateReplybar();
  msgs=[...S.messages(id)];
  hub.style.display="none"; stage.style.display="grid";
  history.replaceState(null,"","#"+id);

  document.getElementById("sessTitle").textContent=s.title;
  document.getElementById("sessSub").textContent=
    s.members.filter(m=>m!=="you").map(m=>member(m).name).join(" · ")||"Just you";
  document.getElementById("headStack").innerHTML=S.stackHtml(s.members,5);
  refreshHeadPin();

  thread.innerHTML=""; clearRail();
  if(msgs.length && !s.custom && id!=="s-personal") thread.insertAdjacentHTML("beforeend", `<div class="gdiv">This week</div>`);
  msgs.forEach(m=> renderMessage(m));
  scrollDown();

  // suggestions only in the personal session, while it's fresh
  suggestEl.style.display = (id==="s-personal" && msgs.length<=1) ? "" : "none";
  input.placeholder = `Message ${s.title}…`;
  setTimeout(()=>{ scrollDown(); input.focus(); }, 60);
}
function closeSession(){
  current=null; stage.style.display="none"; hub.style.display="";
  history.replaceState(null,"",location.pathname);
  renderHub();
}
document.getElementById("backBtn").onclick=closeSession;

function refreshHeadPin(){
  const pin=document.getElementById("headPin");
  const on=onDash(current);
  pin.classList.toggle("on",on);
  pin.innerHTML = on ? `<i class="ri-pushpin-2-fill"></i><span>On your dashboard</span>`
                     : `<i class="ri-pushpin-line"></i><span>Add to dashboard</span>`;
}
document.getElementById("headPin").onclick=()=>{ if(current){ addToDash(current); refreshHeadPin(); } };

/* ---------- message rendering ---------- */
function renderRich(text, numMap){
  let html=escapeHtml(text);
  html=html.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  html=html.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g,(m,g)=> g.split(/\s*,\s*/).map(k=>{
    const n=numMap && numMap[+k];
    return n ? `<span class="cite" data-n="${n}">${n}</span>` : `<span class="cite dim">?</span>`;
  }).join(", "));
  return html.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}

function renderMessage(m, opts={}){
  const who=member(m.who);
  const el=document.createElement("div");
  el.className="gmsg"; el.dataset.mid=m.id;
  if(opts.instant) el.style.animation="none";

  // reply reference (quoted original, Discord-style)
  let ref="";
  if(m.replyTo){
    const orig=msgs.find(x=>x.id===m.replyTo);
    if(orig){
      const ow=member(orig.who);
      ref=`<div class="gref" data-jump="${orig.id}">
        <span class="elbow"></span>
        ${S.avatarHtml(orig.who)}
        <span class="rn" style="color:${ow.color}">${escapeHtml(ow.name)}</span>
        <span class="gq">${escapeHtml(S.plain(orig.text)).slice(0,90)}</span>
      </div>`;
    }
  }

  // assign global citation numbers for this message's sources
  let numMap=null;
  if(m.sources && m.sources.length){
    numMap={};
    const registered=m.sources.map((src,i)=>{
      const num=++citeSeq; numMap[i+1]=num;
      const s={...src, num};
      srcMap[num]=s;
      return s;
    });
    registerSources(registered);
  }

  const av = who.ai ? `<span class="gav ai"><i class="ri-sparkling-2-fill"></i></span>`
                    : `<span class="gav" style="background:${who.color}">${who.initials}</span>`;
  el.innerHTML=`${av}
    <div class="gmain">
      ${ref}
      <div class="ghead"><span class="gname" style="color:${who.color}">${escapeHtml(who.name)}</span><span class="gtime">${escapeHtml(m.time||"")}</span></div>
      <div class="gbody">${renderRich(m.text, numMap)}</div>
    </div>
    <div class="gact"><button title="Reply" data-reply="${m.id}"><i class="ri-reply-line"></i></button></div>`;

  thread.appendChild(el);
  wireCites(el.querySelector(".gbody"));
  const j=el.querySelector(".gref"); if(j) j.onclick=()=> jumpTo(j.dataset.jump);
  el.querySelector("[data-reply]").onclick=()=> setReply(m.id);
  return el;
}

function jumpTo(mid){
  const el=thread.querySelector(`[data-mid="${CSS.escape(mid)}"]`); if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  setTimeout(()=>el.classList.remove("flash"),1300);
}

/* ---------- reply state ---------- */
function setReply(mid){
  const m=msgs.find(x=>x.id===mid); if(!m) return;
  replying=m; updateReplybar(); input.focus();
}
function updateReplybar(){
  if(!replying){ replybar.classList.remove("on"); return; }
  const w=member(replying.who);
  document.getElementById("rbName").textContent=w.name;
  document.getElementById("rbName").style.color=w.color;
  document.getElementById("rbSnip").textContent=S.plain(replying.text).slice(0,110);
  replybar.classList.add("on");
}
document.getElementById("rbX").onclick=()=>{ replying=null; updateReplybar(); };

/* =========================================================================
   sources rail + citation popover (NotebookLM-style tracing)
   ========================================================================= */
function registerSources(sources){
  if(sourcesEl.querySelector(".empty")) sourcesEl.innerHTML="";
  sources.forEach(s=>{
    if(document.getElementById("src-"+s.num)) return;
    const card=document.createElement("div"); card.className="srccard"; card.id="src-"+s.num;
    card.innerHTML=`<div class="num">${s.num}</div>
      <div class="nm">${escapeHtml(s.name)}</div>
      <div class="meta">${escapeHtml(s.code)} · p.${escapeHtml(s.page)} · ${escapeHtml(s.type)} · ${escapeHtml(s.date)}</div>
      <div class="snip">${escapeHtml(s.text)}</div>
      <div class="pips">${(s.goals||[]).map(g=>`<i title="SDG ${g}" style="background:${(Sally.sdg(g)||{}).color||'#888'}"></i>`).join("")}</div>`;
    card.onclick=()=> location.href="sally-sources.html#"+s.code;
    sourcesEl.appendChild(card);
  });
  const total=sourcesEl.querySelectorAll(".srccard").length;
  rcount.textContent = total ? total+" citation"+(total>1?"s":"") : "Citations appear here";
}
function flashSource(num){
  const el=document.getElementById("src-"+num); if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  setTimeout(()=>el.classList.remove("flash"),1400);
}

const pop=document.createElement("div"); pop.className="citepop"; document.body.appendChild(pop);
let popTimer=null;
function showPop(chip, s){
  pop.innerHTML=`<div class="pnm">${escapeHtml(s.name)}</div>
    <div class="pmeta">${escapeHtml(s.code)} · p.${escapeHtml(s.page)} · ${escapeHtml(s.type)} · ${escapeHtml(s.date)}</div>
    <div class="ptext">“${escapeHtml(s.text)}”</div>
    <div class="ptrace"><i class="ri-corner-down-right-line"></i> Sources › ${escapeHtml(s.code)} › p.${escapeHtml(s.page)}</div>`;
  pop.classList.add("show");
  const r=chip.getBoundingClientRect(), pw=Math.min(330, window.innerWidth-24);
  pop.style.width=pw+"px";
  let left=r.left + r.width/2 - pw/2; left=Math.max(12, Math.min(left, window.innerWidth-pw-12));
  const ph=pop.offsetHeight; let top=r.top-ph-10; if(top<12) top=r.bottom+10;
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
function hidePop(){ pop.classList.remove("show"); }
pop.addEventListener("mouseenter",()=>clearTimeout(popTimer));
pop.addEventListener("mouseleave",hidePop);

function wireCites(bubble){
  if(!bubble) return;
  bubble.querySelectorAll(".cite").forEach(chip=>{
    const n=+chip.dataset.n, s=srcMap[n];
    if(!s){ chip.classList.add("dim"); return; }
    chip.addEventListener("mouseenter",()=>{ clearTimeout(popTimer); showPop(chip,s); });
    chip.addEventListener("mouseleave",()=>{ popTimer=setTimeout(hidePop,140); });
    chip.addEventListener("click",e=>{ e.stopPropagation(); flashSource(n); });
  });
}

/* =========================================================================
   retrieval (shared by AI + offline)
   ========================================================================= */
const STOP = new Set(("the a an of to and or is are was were be been being how what which who whom whose does do did "+
  "for in on at by with about into from as it its their your our we you they this that these those there here "+
  "tell me give show whats what's whatre how's any some all more most can could would should will won't don't "+
  "have has had not no yes so if then than over under up down out off again very much many lot get got make").split(/\s+/));
function tokenize(s){ return s.toLowerCase().replace(/[^a-z0-9\s/&-]/g," ").split(/\s+/).filter(w=>w.length>1 && !STOP.has(w)); }
function wordHits(hay,w){ const re=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g"); return (hay.match(re)||[]).length; }
function srcText(d){ return (d.cite && d.cite.t) ? d.cite.t : (d.summary||""); }
function retrieve(query, k=5){
  const q = tokenize(query); if(!q.length) return [];
  const scored = Sally.DOCS.map(d=>{
    const hay = (d.name+" "+(d.summary||"")+" "+srcText(d)+" "+(d.concepts||[]).join(" ")+" "+d.type+" "+
      (d.goals||[]).map(g=>(Sally.sdg(g)||{}).name||"").join(" ")).toLowerCase();
    const nameHay = d.name.toLowerCase(); let s=0;
    q.forEach(w=>{ s+=wordHits(hay,w); if(wordHits(nameHay,w)) s+=2; });
    (d.concepts||[]).forEach(c=>{ const cl=c.toLowerCase(); if(q.some(w=>wordHits(cl,w)||cl.split(/[\s/&-]+/).includes(w))) s+=4; });
    return {d,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return scored.slice(0,k).map(x=>x.d);
}
function goalsForCitation(c){
  const doc=Sally.DOCS.find(d=> d.code===(c.code||"") || d.name===(c.title||""));
  if(doc) return doc.goals||[];
  const t=((c.title||"")+" "+(c.quote||"")).toLowerCase(), g=[];
  Sally.SDG.forEach(s=>{ if(t.includes(s.short.toLowerCase())) g.push(s.n); });
  return g.slice(0,3);
}

/* =========================================================================
   Sally's live group answers — always replies, in every session.
   Stored with MESSAGE-LOCAL [n] markers + a sources array (no globals).
   ========================================================================= */
function typingEl(){
  const el=document.createElement("div"); el.className="gmsg";
  el.innerHTML=`<span class="gav ai"><i class="ri-sparkling-2-fill"></i></span>
    <div class="gmain"><div class="ghead"><span class="gname" style="color:${TEAM.sally.color}">Sally</span></div>
    <div class="gbody"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
  thread.appendChild(el); scrollDown(); return el;
}
function commitSally(text, sources, replyToId){
  const m={ id:"m"+Date.now(), who:"sally", time:nowTime(), text, replyTo:replyToId||null,
            sources:(sources&&sources.length)?sources:undefined };
  S.append(current, m); msgs.push(m);
  renderMessage(m); scrollDown();
}

async function answerAI(userMsg){
  const s=S.get(current);
  const tEl=typingEl();
  const corpus=Sally.DOCS.slice(0,40).map(d=>`${d.code} — ${d.name} (${d.type}${d.cite&&d.cite.p?`, p.${d.cite.p}`:""})`).join("\n");
  const roster=s.members.map(m=>{const w=member(m); return `${w.name} (${w.role})`;}).join(", ");
  const transcript=msgs.slice(-10).map(m=>`${member(m.who).name}: ${S.plain(m.text)}`).join("\n");
  const sys=`You are Sally, a confident AI sustainability analyst embedded in a team chat session called "${s.title}" at ${company}. Members: ${roster}. You reply conversationally, like a sharp colleague in a group chat — concise (1–3 short paragraphs), addressing the latest message, and you ALWAYS cite at least 2 sources.
Return STRICT JSON only:
{"answer":"reply text with inline citation markers like [1], [2]","citations":[{"title":string,"code":short UPPERCASE id,"page":number,"type":"Report|Policy|Audit|Strategy|Memo|Register|Dashboard|Review","quote":"a specific sentence that supports the claim"}]}
Rules: every [n] in answer maps to citations[n-1] (1-indexed, in order). Prefer documents from the CORPUS list (real code + title). You MAY treat anything teammates stated in this conversation as a citable source (title "Live input from <name>"). Make quotes specific and plausible with figures. Output the JSON object and nothing else.`;
  const usr=`CORPUS (you may cite these):\n${corpus}\n\nCONVERSATION SO FAR:\n${transcript}\n\nThe latest message to answer is from You: ${userMsg.text}\n\nReturn the JSON.`;
  let data;
  try{ data=await Sally.LLM.json([{role:"system",content:sys},{role:"user",content:usr}],{max_tokens:900, temperature:0.4}); }
  catch(e){
    tEl.remove();
    commitSally(`⚠️ ${e.message} — open **Settings** (gear in the dock) to check your key, or clear it for offline demo mode.`, null, userMsg.id);
    return;
  }
  tEl.remove();
  let cits=Array.isArray(data.citations)?data.citations.filter(c=>c&&(c.title||c.quote)):[];
  if(!cits.length) cits=[{title:`${company} sustainability disclosures`, code:"LUM-ESG", page:1, type:"Report", quote:String(data.answer||"").slice(0,160)}];
  const sources=cits.map(c=>({ code:String(c.code||"DOC").toUpperCase().slice(0,16), name:String(c.title||"Source").slice(0,90),
    page:Math.max(1,parseInt(c.page,10)||1), type:String(c.type||"Source").slice(0,18), date:String(Sally.company.reportYear||2024),
    text:String(c.quote||c.title||"").slice(0,300), goals:goalsForCitation(c) }));
  // clamp local markers to the available citations
  const answer=String(data.answer||"I don't have an answer for that.").replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g,(m,g)=>
    "["+g.split(/\s*,\s*/).map(x=>{ let k=parseInt(x,10); if(!(k>=1&&k<=sources.length)) k=(Math.abs(k-1)%sources.length)+1; return k; }).join(", ")+"]");
  commitSally(answer, sources, userMsg.id);
}

async function answerOffline(userMsg){
  let docs=retrieve(userMsg.text,3);
  if(!docs.length) docs=Sally.recentDocs(2);            // never say "no sources"
  const sources=docs.map(d=>({ code:d.code, name:d.name, page:(d.cite&&d.cite.p)||1,
    type:d.type, date:d.date, text:srcText(d), goals:d.goals||[] }));
  const tEl=typingEl(); await wait(650+Math.random()*500);
  tEl.remove();
  const parts=[`Here's what ${company} reports on this, drawn from ${sources.length} source${sources.length>1?"s":""}.`];
  sources.forEach((s,i)=>{ const lead=i===0?"":(i===1?"Alongside that, ":"And "); parts.push(`${lead}the ${s.name} notes that “${s.text.replace(/\.$/,"")}” [${i+1}].`); });
  commitSally(parts.join("\n\n"), sources, userMsg.id);
}

/* ---------- submit ---------- */
function autosize(){ input.style.height="auto"; input.style.height=Math.min(120,input.scrollHeight)+"px"; }
input.addEventListener("input",autosize);
async function submit(){
  const text=input.value.trim(); if(!text||busy||!current) return;
  busy=true; send.disabled=true; suggestEl.style.display="none";
  const m={ id:"m"+Date.now(), who:"you", time:nowTime(), text, replyTo:replying?replying.id:null };
  S.append(current, m); msgs.push(m);
  renderMessage(m); scrollDown();
  replying=null; updateReplybar();
  input.value=""; autosize();
  // Sally always answers — in every session
  if(Sally.LLM && Sally.LLM.configured()) await answerAI(m); else await answerOffline(m);
  scrollDown();
  busy=false; send.disabled=false; input.focus();
}
send.onclick=submit;
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); submit(); }});

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(replying){ replying=null; updateReplybar(); return; }
  if(current && document.activeElement!==input) closeSession();
});

/* ---------- AI/offline pill + hint ---------- */
const pill=document.getElementById("modePill");
pill.onclick=()=> Sally.openSettings && Sally.openSettings();
function renderPill(){
  const on = Sally.LLM && Sally.LLM.configured();
  pill.classList.toggle("on", on);
  pill.innerHTML = on ? `<span class="d"></span>${Sally.LLM.cfg().model}` : `<span class="d"></span>Offline`;
}
function refreshHint(){
  document.getElementById("hint").textContent = (Sally.LLM && Sally.LLM.configured())
    ? `Grounded in ${Sally.DOCS.length} documents · answered by ${Sally.LLM.cfg().model} with traceable citations.`
    : `Sally answers from the ${Sally.DOCS.length} documents in the corpus — add a DeepSeek key in Settings for live AI.`;
}
renderPill(); refreshHint();
document.addEventListener("sally:llm-config", ()=>{ renderPill(); refreshHint(); });

/* ---------- suggested prompts (personal session) ---------- */
const SUGGEST=[
  `How is ${company} cutting carbon emissions?`,
  "What's being done on diversity and pay equity?",
  "Tell me about workplace safety.",
  "What governance controls exist?",
];
document.getElementById("chips").innerHTML = SUGGEST.map(q=>`<button class="chip qchip">${q}</button>`).join("");
document.querySelectorAll(".qchip").forEach(b=> b.onclick=()=>{ input.value=b.textContent; submit(); });

/* ---------- routing: #session-id · ?q= deep link ---------- */
function route(){
  const q=new URLSearchParams(location.search).get("q");
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(q && q.trim()){
    openSession("s-personal");
    input.value=q.trim(); autosize();
    history.replaceState(null,"",location.pathname+"#s-personal");
    submit();
    return;
  }
  if(h && S.get(h)){ openSession(h); return; }
  renderHub();
}
window.addEventListener("hashchange",()=>{
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(h && S.get(h)){ if(h!==current) openSession(h); }
  else if(current) closeSession();
});
route();
</script>
