/* ===== Design tokens (clean iOS-dark — shared with the rest of Sally) ===== */
:root{
  --ink:#0f0f11;          /* near-black field               */
  --ink-2:#161618;
  --ink-3:rgba(255,255,255,0.05);
  --bg-surface:#1c1c1e;
  --panel:rgba(28,28,30,0.88);
  --panel-2:rgba(255,255,255,0.05);
  --line:rgba(255,255,255,0.10);
  --line-2:rgba(255,255,255,0.16);
  --text:#ffffff;
  --muted:#a1a1a6;
  --faint:#8a8a8f;
  --faint-2:#6e6e73;
  --glass-hi:rgba(255,255,255,0.10);
  --glass-bg:rgba(28,28,30,0.55);
  --glass-border:rgba(255,255,255,0.12);
  --display:'Inter', ui-sans-serif, system-ui, sans-serif;
  --body:'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --doc:#dfe3ea;          /* near-white documents */
  --concept:#7e8693;      /* muted grey concepts  */
  --accent:#0a84ff;       /* iOS-blue accent (chrome only; SDG colours stay data) */
  --accent-2:#409cff;
  --accent-3:#5ab0ff;
  --accent-glow:rgba(10,132,255,0.5);
  --accent-soft:rgba(10,132,255,0.14);
  --accent-line:rgba(10,132,255,0.40);
  --dock-width:64px; --dock-margin:16px;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* clean near-black field — behind the graph */
#backdrop{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:radial-gradient(130% 120% at 50% -10%, #18181c 0%, #0f0f11 58%);}
#vignette{
  position:fixed; inset:0; z-index:3; pointer-events:none;
  box-shadow: inset 0 0 260px 70px rgba(0,0,0,0.55);
  background:radial-gradient(120% 120% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
}

#neural-bg{position:fixed; inset:0; z-index:0; pointer-events:none}
#graph{position:fixed; inset:0; z-index:1}
canvas{display:block}

/* ===== Top chrome bar (floating glass) ===== */
#topbar{
  position:fixed; z-index:5; top:16px; left:calc(var(--dock-width) + var(--dock-margin)*2); right:18px;
  display:flex; align-items:center; gap:14px;
  padding:10px 16px; border-radius:18px;
  background:var(--glass-bg);
  backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 12px 40px -22px rgba(0,0,0,.6);
  pointer-events:none;
}
#topbar > *{pointer-events:auto}
.kg-title{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:-0.01em; color:var(--text); white-space:nowrap}

/* ===== glass icon-dock (matches the rest of Sally) ===== */
.floating-dock{ position:fixed; z-index:8; top:50%; left:var(--dock-margin); transform:translateY(-50%);
  width:var(--dock-width); display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 0;
  background:var(--glass-bg); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-border); border-radius:22px;
  box-shadow:0 12px 40px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.10) inset; }
.dock-brand{ display:flex; align-items:center; justify-content:center; width:40px;height:40px; margin-bottom:6px }
.dock-brand .dot{ width:26px;height:26px;border-radius:9px; position:relative;
  background:linear-gradient(140deg,#5ab0ff 0%,var(--accent) 55%,#0a5fd6 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.22) inset, 0 6px 16px -6px var(--accent) }
.dock-brand .dot::after{ content:""; position:absolute; inset:5px; border-radius:5px;
  background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%) }
.dock-items{ display:flex; flex-direction:column; align-items:center; gap:4px; width:100% }
.dock-item{ position:relative; display:flex; align-items:center; justify-content:center;
  width:44px;height:44px; color:var(--muted); font-size:22px; border-radius:13px; text-decoration:none;
  transition:all .2s cubic-bezier(.2,.8,.2,1) }
.dock-item:hover{ background:rgba(128,128,128,0.14); color:var(--text); transform:scale(1.06) }
.dock-item.active{ color:#fff; background:linear-gradient(140deg,var(--accent-2),var(--accent));
  box-shadow:0 6px 16px -6px var(--accent), 0 1px 0 rgba(255,255,255,.3) inset }
.dock-item::before{ content:attr(data-label); position:absolute; left:calc(100% + 14px); top:50%;
  transform:translateY(-50%) translateX(-6px); background:var(--bg-surface); color:var(--text); font-family:var(--body);
  font-size:12px; font-weight:500; white-space:nowrap; padding:6px 10px; border-radius:8px; border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.32); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:5 }
.dock-item:hover::before{ opacity:1; transform:translateY(-50%) translateX(0) }
.brand{display:flex; align-items:baseline; gap:10px; user-select:none; text-decoration:none; color:inherit; cursor:pointer}
.brand .logo{
  font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:-0.02em;
  color:var(--text);
}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);align-self:center;box-shadow:0 0 8px var(--accent-glow)}
.brand .logo b{color:var(--accent-3)}
.brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}

/* nav */
nav{position:relative; display:flex; gap:2px; margin-left:6px; padding:4px;
  border-radius:999px; background:rgba(0,0,0,0.18); border:1px solid var(--line)}
nav a{position:relative; z-index:1;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); text-decoration:none; padding:8px 13px; border-radius:999px; transition:color .2s;
}
nav a:hover{color:var(--muted)}
nav a.active{color:#fff}
.nav-pill{position:absolute; z-index:0; top:4px; left:4px; height:calc(100% - 8px); width:0;
  border-radius:999px; background:linear-gradient(140deg, var(--accent-2), var(--accent));
  box-shadow:0 6px 18px -6px var(--accent-glow), 0 1px 0 rgba(255,255,255,.25) inset;
  transition:transform .34s cubic-bezier(.3,.9,.3,1.1), width .34s cubic-bezier(.3,.9,.3,1.1), opacity .2s; opacity:0}

.spacer{flex:1}

/* search */
.search{position:relative; display:flex; align-items:center}
.search svg{position:absolute; left:11px; width:13px; height:13px; stroke:var(--faint); pointer-events:none}
#search{
  font-family:var(--mono); font-size:12px; color:var(--text);
  background:var(--ink-3); border:1px solid var(--line); border-radius:11px;
  padding:9px 12px 9px 31px; width:228px; outline:none; transition:.18s;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
#search::placeholder{color:var(--faint); letter-spacing:.04em}
#search:focus{border-color:var(--accent-line); background:rgba(255,255,255,0.07); width:264px; box-shadow:0 0 0 3px var(--accent-soft)}

/* segmented type filters */
.filters{display:flex; gap:2px; padding:3px; background:rgba(0,0,0,0.18); border:1px solid var(--line); border-radius:999px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.filters button{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); background:transparent; border:0; cursor:pointer;
  padding:7px 13px; border-radius:999px; transition:.16s; display:flex; align-items:center; gap:7px;
}
.filters button:hover{color:var(--muted)}
.filters button.on{color:#fff; background:linear-gradient(140deg,var(--accent-2),var(--accent));
  box-shadow:0 6px 16px -6px var(--accent-glow), 0 1px 0 rgba(255,255,255,.25) inset}
.filters button .pip{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;transition:.16s}
.filters button.on[data-type="goal"] .pip{background:currentColor}
.filters button.on .pip{background:currentColor}
.filters button:not(.on) .pip{opacity:.5}

/* generic chrome button */
.btn{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); background:var(--ink-3); border:1px solid var(--line);
  border-radius:11px; padding:9px 13px; cursor:pointer; transition:.16s;
  display:flex; align-items:center; gap:8px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 1px 0 var(--glass-hi) inset;
}
.btn:hover{color:var(--text); border-color:var(--line-2); background:rgba(255,255,255,0.08); transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.btn-up{color:#fff; background:linear-gradient(140deg,var(--accent-2),var(--accent)); border-color:transparent;
  box-shadow:0 8px 20px -10px var(--accent)}
.btn-up:hover{color:#fff; filter:brightness(1.08); background:linear-gradient(140deg,var(--accent-2),var(--accent))}
.btn.busy{opacity:.6; pointer-events:none}

/* ===== Legend (bottom-left) ===== */
#legend{
  position:fixed; z-index:5; left:18px; bottom:18px;
  background:linear-gradient(160deg, rgba(255,255,255,0.085), rgba(255,255,255,0.04));
  border:1px solid var(--line); border-radius:18px; padding:14px 16px;
  backdrop-filter:blur(24px) saturate(150%); -webkit-backdrop-filter:blur(24px) saturate(150%);
  box-shadow:0 1px 0 var(--glass-hi) inset, 0 22px 50px -28px rgba(0,0,0,.6);
}
#legend .ttl{font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin-bottom:10px}
#legend .row{display:flex; align-items:center; gap:10px; margin:7px 0; font-family:var(--mono); font-size:11px; color:var(--muted)}
#legend .g-swatch{width:13px;height:13px;border-radius:50%;
  background:conic-gradient(#FCC30B,#3F7E44,#00689D,#E5243B,#FF3A21,#26BDE2,#FCC30B);
  box-shadow:0 0 8px rgba(255,255,255,.18)}
#legend .c-swatch{width:11px;height:11px;border-radius:50%;background:var(--concept)}
#legend .d-swatch{width:10px;height:10px;border-radius:50%;background:transparent;border:1.5px solid var(--doc)}
#legend .hint{margin-top:11px; padding-top:10px; border-top:1px solid var(--line);
  font-family:var(--mono); font-size:9.5px; color:var(--faint-2); line-height:1.7; letter-spacing:.03em}

/* ===== Detail panel (slide-in, right) ===== */
#panel{
  position:fixed; z-index:6; top:0; right:0; height:100%; width:380px; max-width:88vw;
  background:linear-gradient(160deg, rgba(28,24,44,0.80), rgba(18,15,30,0.76)); border-left:1px solid var(--line);
  backdrop-filter:blur(30px) saturate(150%); -webkit-backdrop-filter:blur(30px) saturate(150%);
  transform:translateX(105%); transition:transform .42s cubic-bezier(.22,.61,.36,1);
  display:flex; flex-direction:column; box-shadow:-30px 0 80px rgba(0,0,0,.5);
}
#panel.open{transform:translateX(0)}
#panel .phead{padding:26px 26px 20px; border-bottom:1px solid var(--line); position:relative}
#panel .ptype{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); display:flex; align-items:center; gap:9px}
#panel .ptype .swatch{width:10px;height:10px;border-radius:50%}
#panel .pcode{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:14px; letter-spacing:.04em}
#panel .ptitle{font-family:var(--display); font-weight:700; font-size:25px; line-height:1.16; letter-spacing:-0.02em; margin-top:7px; color:var(--text)}
#panel .pclose{position:absolute; top:22px; right:22px; width:30px;height:30px; border-radius:8px;
  display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--faint);
  background:rgba(255,255,255,0.03); border:1px solid var(--line); transition:.16s}
#panel .pclose:hover{color:var(--text); border-color:var(--line-2)}
#panel .pbody{padding:8px 26px 26px; overflow-y:auto; flex:1}
#panel .pbody::-webkit-scrollbar{width:8px}
#panel .pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08); border-radius:4px}
#panel .group{margin-top:24px}
#panel .group h4{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin:0 0 12px; display:flex; align-items:center; gap:8px}
#panel .group h4 .count{color:var(--faint-2)}
#panel .item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; margin:5px 0;
  background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:9px;
  cursor:pointer; transition:.15s;
}
#panel .item:hover{background:rgba(255,255,255,0.05); border-color:var(--line-2); transform:translateX(2px)}
#panel .item .ic{width:11px;height:11px;border-radius:50%;flex:none}
#panel .item .ic.ring{background:transparent;border:1.5px solid var(--doc)}
#panel .item .nm{font-family:var(--body); font-size:13.5px; color:var(--text); line-height:1.3}
#panel .item .meta{font-family:var(--mono); font-size:10px; color:var(--faint); margin-left:auto; flex:none}
#panel .pfoot{padding:16px 26px; border-top:1px solid var(--line)}
#panel .isolate-note{font-family:var(--mono); font-size:10.5px; color:var(--faint); line-height:1.6; letter-spacing:.02em}

/* status / hint pill bottom-center */
#status{
  position:fixed; z-index:5; left:50%; bottom:22px; transform:translateX(-50%);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--faint);
  background:rgba(10,12,16,0.7); border:1px solid var(--line); border-radius:999px;
  padding:8px 16px; backdrop-filter:blur(8px); transition:opacity .3s; pointer-events:none;
  white-space:nowrap;
}
#status b{color:var(--muted); font-weight:500}

@media (max-width:720px){
  nav,.brand .sub{display:none}
  #search{width:150px}
  #search:focus{width:180px}
}
</style>
</head>
<body>
<div id="backdrop"></div>
<canvas id="neural-bg"></canvas>
<div id="graph"></div>
<div id="vignette"></div>

<!-- ===== Top chrome ===== -->
<!-- ===== Glass icon-dock (primary nav, matches the rest of Sally) ===== -->
<nav class="floating-dock" aria-label="Primary">
  <a class="dock-brand" href="index.html" title="Sally home"><span class="dot"></span></a>
  <div class="dock-items">
    <a class="dock-item" href="index.html" data-label="Dashboard"><i class="ri-dashboard-line"></i></a>
    <a class="dock-item" href="sally-ask.html" data-label="Ask Sally"><i class="ri-chat-3-line"></i></a>
    <a class="dock-item" href="sally-documents.html" data-label="Documents"><i class="ri-file-list-2-line"></i></a>
    <a class="dock-item active" href="sally-knowledge-graph.html" data-label="Knowledge Graph"><i class="ri-bubble-chart-line"></i></a>
    <a class="dock-item" href="sally-sdg-compliance.html" data-label="Compliance"><i class="ri-shield-check-line"></i></a>
  </div>
</nav>

<!-- ===== Top control bar (graph tools) ===== -->
<header id="topbar">
  <span class="kg-title">Knowledge Graph</span>

  <div class="spacer"></div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search the graph…" autocomplete="off" spellcheck="false">
  </div>

  <div class="filters" id="filters">
    <button class="on" data-type="goal"><span class="pip"></span>Goals</button>
    <button class="on" data-type="concept"><span class="pip"></span>Concepts</button>
    <button class="on" data-type="document"><span class="pip"></span>Docs</button>
  </div>

  <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
  <button class="btn btn-up" id="uploadBtn" title="Upload a PDF — Sally reads it and grows the graph">
    <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    Upload PDF
  </button>

  <button class="btn" id="replay" title="Re-run the layout">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Replay
  </button>
</header>

<!-- ===== Legend ===== -->
<div id="legend">
  <div class="ttl">Legend</div>
  <div class="row"><span class="g-swatch"></span> SDG goal — hub</div>
  <div class="row"><span class="c-swatch"></span> Concept — topic</div>
  <div class="row"><span class="d-swatch"></span> Document — source</div>
  <div class="hint">click an sdg → spotlight evidence<br>hover → trace neighbors · drag · scroll-zoom<br>double-click empty → fit all</div>
</div>

<!-- ===== Detail panel ===== -->
<aside id="panel">
  <div class="phead">
    <div class="pclose" id="pclose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
    <div class="ptype" id="ptype"></div>
    <div class="ptitle" id="ptitle"></div>
    <div class="pcode" id="pcode"></div>
  </div>
  <div class="pbody" id="pbody"></div>
  <div class="pfoot" id="pfoot"></div>
</aside>

<div id="status"></div>

<!-- ===== Graph application ===== -->
<script>
"use strict";
(function(){

/* ---------------------------------------------------------------------------
   1. SEED DATA  — official SDG colours, the document corpus & its citations,
      concepts, and all edge wiring. Shared corpus with the compliance view.
--------------------------------------------------------------------------- */
const SDG = [
  {n:1,  name:"No Poverty",                         color:"#E5243B"},
  {n:2,  name:"Zero Hunger",                        color:"#DDA63A"},
  {n:3,  name:"Good Health & Well-being",           color:"#4C9F38"},
  {n:4,  name:"Quality Education",                  color:"#C5192D"},
  {n:5,  name:"Gender Equality",                    color:"#FF3A21"},
  {n:6,  name:"Clean Water & Sanitation",           color:"#26BDE2"},
  {n:7,  name:"Affordable & Clean Energy",          color:"#FCC30B"},
  {n:8,  name:"Decent Work & Economic Growth",      color:"#A21942"},
  {n:9,  name:"Industry, Innovation & Infrastructure", color:"#FD6925"},
  {n:10, name:"Reduced Inequalities",               color:"#DD1367"},
  {n:11, name:"Sustainable Cities & Communities",   color:"#FD9D24"},
  {n:12, name:"Responsible Consumption & Production",color:"#BF8B2E"},
  {n:13, name:"Climate Action",                     color:"#3F7E44"},
  {n:14, name:"Life Below Water",                   color:"#0A97D9"},
  {n:15, name:"Life on Land",                       color:"#56C02B"},
  {n:16, name:"Peace, Justice & Strong Institutions",color:"#00689D"},
  {n:17, name:"Partnerships for the Goals",         color:"#19486A"},
];

// concept -> goals it advances
const CONCEPTS = {
  "Renewable Energy":          {goals:[7,13]},
  "Energy Efficiency":         {goals:[7,12]},
  "Emissions":                 {goals:[13]},
  "Net-Zero":                  {goals:[13,7]},
  "Waste Reduction":           {goals:[12]},
  "Circular Economy":          {goals:[12,15]},
  "Workforce Wellbeing":       {goals:[3,8]},
  "Workplace Safety":          {goals:[3,8]},
  "Training & Apprenticeships":{goals:[4,8]},
  "Diversity & Inclusion":     {goals:[5,10]},
  "Pay Equity":                {goals:[5,10]},
  "Governance & Ethics":       {goals:[16]},
  "Anti-Corruption":           {goals:[16]},
  "R&D / Innovation":          {goals:[9]},
  "Manufacturing Efficiency":  {goals:[9,12]},
  "University Partnerships":   {goals:[17,4]},
  "Supply Chain":              {goals:[12,8]},
};

// documents -> goals they are cited as evidence for (from the dashboard) + tagged concepts
const DOCS = [
  {name:"EHS Annual Review 2024",      code:"EHS-2024",      goals:[3,8],    concepts:["Workplace Safety","Workforce Wellbeing"]},
  {name:"HR Benefits Policy",          code:"HR-BEN",        goals:[3,8],    concepts:["Workforce Wellbeing"]},
  {name:"L&D Report 2024",             code:"LND-2024",      goals:[4,8],    concepts:["Training & Apprenticeships"]},
  {name:"Talent Strategy 2024",        code:"TAL-2024",      goals:[8,4],    concepts:["Training & Apprenticeships","Diversity & Inclusion"]},
  {name:"Diversity Dashboard 2024",    code:"DIV-2024",      goals:[5,10],   concepts:["Diversity & Inclusion"]},
  {name:"Pay Equity Audit 2024",       code:"PEA-2024",      goals:[5,10,8], concepts:["Pay Equity","Diversity & Inclusion"]},
  {name:"Energy Transition Report 2024",code:"ENT-2024",     goals:[7,13],   concepts:["Renewable Energy","Energy Efficiency"]},
  {name:"Procurement Memo EN-2024-118",code:"EN-2024-118",   goals:[12,8],   concepts:["Supply Chain"]},
  {name:"Facilities Report",           code:"FAC-2024",      goals:[7,12],   concepts:["Energy Efficiency","Manufacturing Efficiency"]},
  {name:"HR Policy Manual",            code:"HR-MAN",        goals:[8,5],    concepts:["Workforce Wellbeing","Diversity & Inclusion"]},
  {name:"People Report 2024",          code:"PPL-2024",      goals:[8,5,4],  concepts:["Workforce Wellbeing","Diversity & Inclusion"]},
  {name:"Compensation Policy 2024",    code:"COMP-2024",     goals:[8,10],   concepts:["Pay Equity"]},
  {name:"Annual Report 2024",          code:"AR-2024",       goals:[8,9],    concepts:["Governance & Ethics","R&D / Innovation"]},
  {name:"Operations Review",           code:"OPS-2024",      goals:[9,12],   concepts:["Manufacturing Efficiency","Supply Chain"]},
  {name:"Governance Charter",          code:"GOV-CHTR",      goals:[16],     concepts:["Governance & Ethics"]},
  {name:"Sustainability Report 2024",  code:"SUS-2024",      goals:[12,13,7],concepts:["Emissions","Circular Economy","Net-Zero"]},
  {name:"Circularity Brief",           code:"CIR-2024",      goals:[12],     concepts:["Circular Economy","Waste Reduction"]},
  {name:"Carbon Report 2024",          code:"CRB-2024",      goals:[13],     concepts:["Emissions","Net-Zero"]},
  {name:"Climate Strategy",            code:"CLM-STRAT",     goals:[13,7],   concepts:["Net-Zero","Renewable Energy"]},
  {name:"Code of Conduct 2024",        code:"COC-2024",      goals:[16],     concepts:["Governance & Ethics","Anti-Corruption"]},
  {name:"Compliance Log 2024",         code:"CPL-2024",      goals:[16],     concepts:["Anti-Corruption","Governance & Ethics"]},
  {name:"Partnerships Register 2024",  code:"PTR-2024",      goals:[17],     concepts:["University Partnerships"]},
  {name:"Membership Record",           code:"MEM-REC",       goals:[17],     concepts:["University Partnerships"]},
];

// a few related-topic concept<->concept links
const CONCEPT_LINKS = [
  ["Renewable Energy","Net-Zero"],
  ["Renewable Energy","Energy Efficiency"],
  ["Emissions","Net-Zero"],
  ["Circular Economy","Waste Reduction"],
  ["Workforce Wellbeing","Workplace Safety"],
  ["Diversity & Inclusion","Pay Equity"],
  ["Governance & Ethics","Anti-Corruption"],
  ["R&D / Innovation","University Partnerships"],
  ["Manufacturing Efficiency","Supply Chain"],
];

// real SDG interlinkages
const GOAL_LINKS = [[7,13],[12,13],[12,15],[4,8],[9,12],[16,17]];

/* ---- build nodes & links ---- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
const nodes = [], links = [];
const byId = {};
function addNode(n){ byId[n.id]=n; nodes.push(n); return n; }

SDG.forEach(g => addNode({id:"g"+g.n, type:"goal", num:g.n, label:"SDG "+g.n, name:g.name, color:g.color}));
Object.keys(CONCEPTS).forEach(c => addNode({id:"c-"+slug(c), type:"concept", label:c, name:c}));
DOCS.forEach(d => addNode({id:"d-"+slug(d.name), type:"document", label:d.name, name:d.name, code:d.code}));

const linkKey = new Set();
function addLink(s,t,kind){
  const k = s<t ? s+"|"+t : t+"|"+s;
  if(linkKey.has(k)) return; linkKey.add(k);
  links.push({source:s, target:t, kind});
}
// document -> goal (citations)  &  document -> concept
DOCS.forEach(d=>{
  const did="d-"+slug(d.name);
  d.goals.forEach(g=> addLink(did,"g"+g,"doc-goal"));
  d.concepts.forEach(c=> addLink(did,"c-"+slug(c),"doc-concept"));
});
// concept -> goal
Object.keys(CONCEPTS).forEach(c=>{
  const cid="c-"+slug(c);
  CONCEPTS[c].goals.forEach(g=> addLink(cid,"g"+g,"concept-goal"));
});
// concept <-> concept
CONCEPT_LINKS.forEach(([a,b])=> addLink("c-"+slug(a),"c-"+slug(b),"concept-concept"));
// goal <-> goal
GOAL_LINKS.forEach(([a,b])=> addLink("g"+a,"g"+b,"goal-goal"));

/* degree-based sizing + adjacency (computed over the full corpus) */
nodes.forEach(n=>{ n.deg=0; });
links.forEach(l=>{ byId[l.source].deg++; byId[l.target].deg++; });
const RING = {goal:7.5, concept:4.2, document:3.0};
nodes.forEach(n=>{
  n.r = RING[n.type] + Math.sqrt(n.deg) * (n.type==="goal"?2.6:1.4);
  // entrance bloom: start clustered near the centre
  n.x = (Math.random()-0.5)*36;
  n.y = (Math.random()-0.5)*36;
  n._ph = Math.random()*Math.PI*2;          // drift phase
  n._amp = 1.4 + Math.random()*1.8;         // drift amplitude
});

/* ---------------------------------------------------------------------------
   2. GRAPH INSTANCE
--------------------------------------------------------------------------- */
const el = document.getElementById("graph");
const Graph = ForceGraph()(el)
  .backgroundColor("rgba(0,0,0,0)")
  .nodeRelSize(1)
  .nodeId("id")
  .linkSource("source").linkTarget("target")
  .cooldownTicks(Infinity)        // keep rendering; we manage rest/drift ourselves
  .d3VelocityDecay(0.32)
  .warmupTicks(0);

Graph.d3Force("charge").strength(-200).distanceMax(560);
Graph.d3Force("center").strength(0.05);
// gentle containment so unlinked goals (no evidence) don't drift off-screen
Graph.d3Force("contain", (alpha)=>{
  const k = 0.020 * alpha;
  for(const n of nodes){
    if(n===dragNode || n.fx!=null) continue;
    n.vx -= n.x * k;
    n.vy -= n.y * k;
  }
});
Graph.d3Force("link")
  .distance(l=>{
    const k=l.kind;
    if(k==="goal-goal") return 150;
    if(k==="concept-goal") return 64;
    if(k==="doc-goal") return 78;
    if(k==="doc-concept") return 34;
    return 48; // concept-concept
  })
  .strength(l=> l.kind==="doc-concept"?0.5:0.18);

/* adjacency over the *visible* graph, rebuilt whenever data changes */
function buildAdjacency(ns, ls){
  ns.forEach(n=>{ n.neighbors=new Set(); n.adj=new Set(); });
  ls.forEach(l=>{
    const s=(typeof l.source==="object")?l.source:byId[l.source];
    const t=(typeof l.target==="object")?l.target:byId[l.target];
    if(!s||!t) return;
    s.neighbors.add(t); t.neighbors.add(s);
    s.adj.add(l); t.adj.add(l);
  });
}

/* ---------------------------------------------------------------------------
   3. STATE  — filtering, hover-focus, selection, search isolation
--------------------------------------------------------------------------- */
const visibleType = {goal:true, concept:true, document:true};
let hoverNode=null, selNode=null, dragNode=null;
let isolateSet=null;                 // Set of node ids when an SDG is spotlighted
let searchMatches=null;              // Set of node ids matching search
const hiNodes=new Set(), hiLinks=new Set();

function recomputeHighlight(){
  hiNodes.clear(); hiLinks.clear();
  const focus = hoverNode || selNode;
  if(focus && focus.neighbors){
    hiNodes.add(focus);
    focus.neighbors.forEach(nb=> hiNodes.add(nb));
    focus.adj.forEach(l=> hiLinks.add(l));
  }
}

function applyData(){
  const ns = nodes.filter(n=> visibleType[n.type]);
  const okId = new Set(ns.map(n=>n.id));
  const ls = links.filter(l=>{
    const s=(typeof l.source==="object")?l.source.id:l.source;
    const t=(typeof l.target==="object")?l.target.id:l.target;
    return okId.has(s)&&okId.has(t);
  });
  Graph.graphData({nodes:ns, links:ls});
  buildAdjacency(ns, ls);
  recomputeHighlight();
}

/* dim level for a node given all active modes (0 = hidden-ish, 1 = full) */
function nodeAlpha(n){
  if(isolateSet)  return isolateSet.has(n.id) ? 1 : 0.15;
  if(searchMatches) return searchMatches.has(n.id) ? 1 : 0.16;
  if(hoverNode||selNode) return hiNodes.has(n) ? 1 : 0.16;
  return 1;
}
function linkAlphaMul(l){
  if(isolateSet)  return (isolateSet.has(srcId(l))&&isolateSet.has(tgtId(l)))?1:0.04;
  if(searchMatches) return 0.05;
  if(hoverNode||selNode) return hiLinks.has(l)?1:0.05;
  return 1;
}
const srcId = l => (typeof l.source==="object")?l.source.id:l.source;
const tgtId = l => (typeof l.target==="object")?l.target.id:l.target;

/* ---------------------------------------------------------------------------
   4. RENDERING — custom nodes (glow + conditional label) and links
--------------------------------------------------------------------------- */
function hexA(hex,a){
  const x=hex.replace("#","");
  const r=parseInt(x.substr(0,2),16),g=parseInt(x.substr(2,2),16),b=parseInt(x.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

Graph.nodeCanvasObject((n, ctx, scale)=>{
  const a = nodeAlpha(n);
  const focused = (hoverNode===n)||(selNode===n)||(searchMatches&&searchMatches.has(n.id));
  const r = n.r;
  ctx.save();
  ctx.globalAlpha = a;

  if(n.type==="goal"){
    // soft outer glow in the SDG colour
    const glow = ctx.createRadialGradient(n.x,n.y,r*0.4, n.x,n.y, r*(focused?3.4:2.6));
    glow.addColorStop(0, hexA(n.color, focused?0.55:0.34));
    glow.addColorStop(1, hexA(n.color, 0));
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(n.x,n.y, r*(focused?3.4:2.6), 0, 2*Math.PI); ctx.fill();
    // body
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI);
    ctx.fillStyle=n.color; ctx.fill();
    ctx.lineWidth=1.4/scale; ctx.strokeStyle=hexA("#ffffff",0.18); ctx.stroke();
  } else if(n.type==="concept"){
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI);
    ctx.fillStyle = focused ? "#aab2bf" : "#6f7783";
    ctx.fill();
    ctx.lineWidth=1/scale; ctx.strokeStyle=hexA("#ffffff",0.08); ctx.stroke();
  } else { // document — light ring
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI);
    ctx.fillStyle = hexA("#dfe3ea", focused?0.95:0.14);
    ctx.fill();
    ctx.lineWidth=1.4/scale; ctx.strokeStyle=hexA("#dfe3ea", focused?1:0.7); ctx.stroke();
  }

  // selected node → brand-accent ring
  if(selNode===n){
    ctx.beginPath(); ctx.arc(n.x,n.y, r+3.5/scale + 2, 0, 2*Math.PI);
    ctx.lineWidth=2/scale; ctx.strokeStyle=hexA("#0a84ff",0.95); ctx.stroke();
  }

  // ----- labels (mono) -----
  // goal labels always on; concept/doc fade in on zoom-in or when focused/highlighted
  let show=0;
  if(n.type==="goal") show=1;
  else {
    const onByZoom = n.type==="concept"
      ? Math.max(0, Math.min(1,(scale-1.15)/0.9))
      : Math.max(0, Math.min(1,(scale-2.0)/1.2));
    const onByFocus = (focused || hiNodes.has(n)) ? 1 : 0;
    show = Math.max(onByZoom, onByFocus);
  }
  if(show>0.02){
    const px = (n.type==="goal"?12:11);
    ctx.font = `${n.type==="goal"?600:500} ${px/scale}px 'IBM Plex Mono', monospace`;
    ctx.textAlign="center"; ctx.textBaseline="top";
    const label = n.label;
    const ly = n.y + r + 4/scale;
    ctx.globalAlpha = a*show;
    // legibility halo
    ctx.lineWidth = 3/scale; ctx.strokeStyle="rgba(6,8,11,0.92)";
    ctx.lineJoin="round";
    ctx.strokeText(label, n.x, ly);
    ctx.fillStyle = n.type==="goal" ? "rgba(245,247,250,0.96)" : "rgba(200,206,214,0.92)";
    ctx.fillText(label, n.x, ly);
    // goal: second line with the SDG name when zoomed in or focused
    if(n.type==="goal" && (scale>1.25 || focused)){
      const np=8.5/scale;
      ctx.font=`400 ${np}px 'IBM Plex Mono', monospace`;
      ctx.globalAlpha = a*Math.max(focused?1:0, Math.min(1,(scale-1.25)/0.7));
      if(ctx.globalAlpha>0.03){
        ctx.lineWidth=3/scale; ctx.strokeStyle="rgba(6,8,11,0.9)";
        const ny=ly+ (px/scale) + 2/scale;
        ctx.strokeText(n.name, n.x, ny);
        ctx.fillStyle=hexA(n.color,0.92);
        ctx.fillText(n.name, n.x, ny);
      }
    }
  }
  ctx.restore();
});

Graph.nodePointerAreaPaint((n, color, ctx)=>{
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(n.x,n.y, n.r+2, 0, 2*Math.PI); ctx.fill();
});

Graph.linkColor(l=>{
  const m = linkAlphaMul(l);
  const hot = hiLinks.has(l) || (isolateSet && isolateSet.has(srcId(l)) && isolateSet.has(tgtId(l)));
  // tint links touching a goal toward that goal's colour when hot
  if(hot){
    const s=byId[srcId(l)], t=byId[tgtId(l)];
    const g = (s&&s.type==="goal")?s : (t&&t.type==="goal")?t : null;
    if(g) return hexA(g.color, 0.55*m);
    return hexA("#cfd4dc", 0.5*m);
  }
  return hexA("#ffffff", 0.07*m);
});
Graph.linkWidth(l=>{
  const hot = hiLinks.has(l) || (isolateSet && isolateSet.has(srcId(l)) && isolateSet.has(tgtId(l)));
  return hot ? 1.6 : 0.6;
});
Graph.linkDirectionalParticles(0);

/* ---------------------------------------------------------------------------
   5. GENTLE DRIFT — "alive at rest". Capture settled positions on engine stop,
      then orbit each node by a tiny amount every frame.
--------------------------------------------------------------------------- */
let driftOn=false, settled=false, warm=0;
const SETTLE_TICKS=150;

function freezeIntoDrift(doFit){
  nodes.forEach(n=>{ n._bx=n.x; n._by=n.y; });
  driftOn=true;
  Graph.cooldownTicks(0);            // halt the d3 sim; gentle drift takes over
  if(doFit && !settled){
    settled=true;
    Graph.zoomToFit(900,90);
    setStatus("Click an SDG to spotlight its evidence.");
  }
}

// the sim runs with cooldownTicks=Infinity; we settle it ourselves after a warm period
Graph.onEngineTick(()=>{
  driftOn=false;                     // d3 owns positions while ticking
  if(++warm >= SETTLE_TICKS) freezeIntoDrift(true);
});
Graph.onEngineStop(()=> freezeIntoDrift(true));

// gentle continuous drift around each node's settled position → "alive at rest"
Graph.onRenderFramePre((ctx, scale)=>{
  if(!driftOn) return;
  const t = performance.now()/1000;
  for(const n of nodes){
    if(n===dragNode || n.fx!=null || n._bx==null) continue;
    n.x = n._bx + Math.sin(t*0.42 + n._ph) * n._amp;
    n.y = n._by + Math.cos(t*0.37 + n._ph*1.3) * n._amp;
  }
});

/* ---------------------------------------------------------------------------
   6. INTERACTIONS
--------------------------------------------------------------------------- */
Graph.onNodeHover(n=>{
  hoverNode = n || null;
  el.style.cursor = n ? "pointer" : "default";
  recomputeHighlight();
});
Graph.onNodeDrag(n=>{
  dragNode=n; driftOn=false;
  if(settled){ warm=0; Graph.cooldownTicks(Infinity); }  // let neighbours relax while dragging
});
Graph.onNodeDragEnd(n=>{
  dragNode=null; n.fx=undefined; n.fy=undefined;          // release back into gentle drift
  n._bx=n.x; n._by=n.y;
});

Graph.onNodeClick(n=>{
  selNode = n;
  recomputeHighlight();
  openPanel(n);
  if(n.type==="goal"){
    spotlightGoal(n);
  } else {
    isolateSet=null;
    // gently centre on the clicked node
    Graph.centerAt(n.x, n.y, 600);
  }
});

Graph.onBackgroundClick(()=>{ clearFocus(); });

// double-click empty space → zoom to fit all
let lastBg=0;
el.addEventListener("dblclick", e=>{
  // only when not on a node (force-graph swallows node dblclick differently);
  Graph.zoomToFit(700, 90);
});

function spotlightGoal(g){
  // entire supporting subgraph: the goal, concepts that advance it, documents
  // that cite it, documents tagged with those concepts, and linked sibling goals.
  const set=new Set([g.id]);
  g.neighbors.forEach(nb=>{
    set.add(nb.id);
    if(nb.type==="concept"){
      nb.neighbors.forEach(d=>{ if(d.type==="document") set.add(d.id); });
    }
  });
  isolateSet=set;
  searchMatches=null;
  setStatus(`Spotlight — <b>SDG ${g.num}: ${g.name}</b> · ${set.size-1} supporting nodes`);
  // zoom to fit just the cluster
  setTimeout(()=> Graph.zoomToFit(800, 110, nd=> set.has(nd.id)), 60);
}

function clearFocus(){
  const wasIsolated = !!isolateSet;
  selNode=null; isolateSet=null; searchMatches=null;
  searchEl.value="";
  closePanel();
  recomputeHighlight();
  if(wasIsolated) Graph.zoomToFit(700,90);   // smooth "back" from the spotlight
  setStatus("Click an SDG to spotlight its evidence.");
}

/* ---------------------------------------------------------------------------
   7. DETAIL PANEL
--------------------------------------------------------------------------- */
const panel=document.getElementById("panel");
const elType=document.getElementById("ptype");
const elTitle=document.getElementById("ptitle");
const elCode=document.getElementById("pcode");
const elBody=document.getElementById("pbody");
const elFoot=document.getElementById("pfoot");
document.getElementById("pclose").onclick=()=> clearFocus();

function dotFor(n){
  if(n.type==="goal")   return `<span class="ic" style="background:${n.color}"></span>`;
  if(n.type==="concept")return `<span class="ic" style="background:var(--concept)"></span>`;
  return `<span class="ic ring"></span>`;
}
function metaFor(n){
  if(n.type==="goal")    return "SDG "+n.num;
  if(n.type==="document")return n.code||"doc";
  return n.deg+" links";
}
function neighborItems(n, typeFilter){
  const arr=[...n.neighbors].filter(x=> typeFilter.includes(x.type));
  arr.sort((a,b)=> (b.deg-a.deg));
  if(!arr.length) return `<div class="isolate-note">None.</div>`;
  return arr.map(x=>`
    <div class="item" data-go="${x.id}">
      ${dotFor(x)}
      <span class="nm">${x.type==="goal" ? ("SDG "+x.num+" · "+x.name) : x.name}</span>
      <span class="meta">${metaFor(x)}</span>
    </div>`).join("");
}

function openPanel(n){
  let typeLabel, swatch;
  if(n.type==="goal"){ typeLabel="Sustainable Development Goal"; swatch=`<span class="swatch" style="background:${n.color}"></span>`; }
  else if(n.type==="concept"){ typeLabel="Concept · Topic"; swatch=`<span class="swatch" style="background:var(--concept)"></span>`; }
  else { typeLabel="Source Document"; swatch=`<span class="swatch" style="background:transparent;border:1.5px solid var(--doc)"></span>`; }

  elType.innerHTML = swatch + typeLabel;
  elTitle.textContent = n.type==="goal" ? n.name : n.name;
  elCode.textContent = n.type==="goal" ? ("Goal "+n.num+" of 17") : (n.type==="document" ? ("Reference "+(n.code||"")) : (n.deg+" connections in the corpus"));

  let html="";
  if(n.type==="goal"){
    html += group("Evidence documents", neighborItems(n,["document"]));
    html += group("Related concepts",   neighborItems(n,["concept"]));
    html += group("Linked goals",        neighborItems(n,["goal"]));
  } else if(n.type==="document"){
    html += group("Supports goals",   neighborItems(n,["goal"]));
    html += group("Tagged concepts",  neighborItems(n,["concept"]));
  } else {
    html += group("Advances goals",   neighborItems(n,["goal"]));
    html += group("Documents",        neighborItems(n,["document"]));
    html += group("Related concepts", neighborItems(n,["concept"]));
  }
  elBody.innerHTML=html;

  elFoot.innerHTML = n.type==="goal"
    ? `<div class="isolate-note">Spotlighting this goal's supporting subgraph. Click empty space to reset.</div>`
    : `<div class="isolate-note">Click a connected node to follow the thread.</div>`;

  // wire item navigation
  elBody.querySelectorAll(".item").forEach(it=>{
    it.onclick=()=>{
      const tgt=byId[it.getAttribute("data-go")];
      if(!tgt) return;
      selNode=tgt; recomputeHighlight(); openPanel(tgt);
      if(tgt.type==="goal") spotlightGoal(tgt);
      else { isolateSet=null; Graph.centerAt(tgt.x,tgt.y,600); Graph.zoom(Math.max(Graph.zoom(),2.2),600); }
    };
  });

  panel.classList.add("open");
}
function group(title, inner){
  const m=(inner.match(/data-go=/g)||[]).length;
  return `<div class="group"><h4>${title} <span class="count">${m?("· "+m):""}</span></h4>${inner}</div>`;
}
function closePanel(){ panel.classList.remove("open"); }

/* ---------------------------------------------------------------------------
   8. SEARCH + FILTERS + REPLAY
--------------------------------------------------------------------------- */
const searchEl=document.getElementById("search");
searchEl.addEventListener("input", ()=>{
  const q=searchEl.value.trim().toLowerCase();
  if(!q){ searchMatches=null; setStatus("Click an SDG to spotlight its evidence."); return; }
  const m=new Set();
  nodes.forEach(n=>{
    if(!visibleType[n.type]) return;
    const hay=(n.name+" "+n.label+" "+(n.code||"")).toLowerCase();
    if(hay.includes(q)) m.add(n.id);
  });
  searchMatches = m.size? m : new Set(["__none__"]);
  isolateSet=null;
  setStatus(m.size ? `Search — <b>${m.size}</b> match${m.size>1?"es":""} for “${searchEl.value}”` : `No matches for “${searchEl.value}”`);
  if(m.size){
    const pts=nodes.filter(n=>m.has(n.id));
    const cx=pts.reduce((s,n)=>s+n.x,0)/pts.length;
    const cy=pts.reduce((s,n)=>s+n.y,0)/pts.length;
    Graph.centerAt(cx,cy,600);
    if(pts.length<=2) Graph.zoom(3.2,700);
    else setTimeout(()=>Graph.zoomToFit(700,140, n=>m.has(n.id)),40);
  }
});
searchEl.addEventListener("keydown",e=>{ if(e.key==="Escape"){ searchEl.value=""; searchMatches=null; searchEl.blur(); setStatus("Click an SDG to spotlight its evidence."); }});

document.querySelectorAll("#filters button").forEach(b=>{
  b.onclick=()=>{
    const t=b.getAttribute("data-type");
    visibleType[t]=!visibleType[t];
    b.classList.toggle("on", visibleType[t]);
    // collapse focus/selection that may now be hidden
    if(selNode && !visibleType[selNode.type]) { selNode=null; closePanel(); }
    isolateSet=null;
    applyData();
    // relayout the remaining nodes
    warm=0; driftOn=false; Graph.cooldownTicks(Infinity); Graph.d3ReheatSimulation();
  };
});

document.getElementById("replay").onclick=()=> replay();
function replay(){
  clearFocus();
  searchEl.value="";
  driftOn=false; settled=false; warm=0;
  nodes.forEach(n=>{
    n.fx=undefined; n.fy=undefined; n._bx=null; n._by=null;
    n.x=(Math.random()-0.5)*36; n.y=(Math.random()-0.5)*36; n.vx=0; n.vy=0;
  });
  Graph.cooldownTicks(Infinity);
  Graph.d3ReheatSimulation();
  setStatus("Re-running layout…");
}

/* ---------------------------------------------------------------------------
   9. MISC
--------------------------------------------------------------------------- */
const statusEl=document.getElementById("status");
let statusTimer=null;
function setStatus(html){
  statusEl.innerHTML=html; statusEl.style.opacity="1";
}

function resize(){ Graph.width(window.innerWidth).height(window.innerHeight); }
window.addEventListener("resize", resize);
resize();

/* ---------------------------------------------------------------------------
   8.5  Uploaded PDFs → live nodes (persisted via Sally.store)
--------------------------------------------------------------------------- */
function ensureConceptNode(c){
  const id="c-"+slug(c);
  if(!byId[id]){
    addNode({id, type:"concept", label:c, name:c, x:(Math.random()-0.5)*40, y:(Math.random()-0.5)*40,
      _ph:Math.random()*6.283, _amp:1.4+Math.random()*1.8, deg:0});
    const goals=(window.Sally&&Sally.CONCEPTS&&Sally.CONCEPTS[c]&&Sally.CONCEPTS[c].goals)||[];
    goals.forEach(g=>{ if(byId["g"+g]) addLink(id,"g"+g,"concept-goal"); });
  }
  return id;
}
function recomputeSizes(){
  nodes.forEach(n=> n.deg=0);
  links.forEach(l=>{ const s=(typeof l.source==="object")?l.source.id:l.source, t=(typeof l.target==="object")?l.target.id:l.target;
    if(byId[s]) byId[s].deg++; if(byId[t]) byId[t].deg++; });
  nodes.forEach(n=>{ n.r = RING[n.type] + Math.sqrt(n.deg)*(n.type==="goal"?2.6:1.4); });
}
function addDocNode(doc, spotlight){
  const did="d-"+slug(doc.name);
  if(byId[did]){ if(spotlight){ selNode=byId[did]; recomputeHighlight(); openPanel(byId[did]); } return did; }
  addNode({id:did, type:"document", label:doc.name, name:doc.name, code:doc.code,
    x:(Math.random()-0.5)*24, y:(Math.random()-0.5)*24, _ph:Math.random()*6.283, _amp:1.4+Math.random()*1.8, deg:0, _new:true});
  (doc.goals||[]).forEach(g=>{ if(byId["g"+g]) addLink(did,"g"+g,"doc-goal"); });
  (doc.concepts||[]).forEach(c=>{ addLink(did, ensureConceptNode(c), "doc-concept"); });
  recomputeSizes();
  applyData();
  // re-run the settle so the newcomer is pulled into place
  warm=0; settled=false; driftOn=false; Graph.cooldownTicks(Infinity); if(Graph.d3ReheatSimulation) Graph.d3ReheatSimulation();
  if(spotlight){
    const n=byId[did]; selNode=n; recomputeHighlight(); openPanel(n);
    setTimeout(()=>{ if(n.x!=null){ Graph.centerAt(n.x,n.y,1100); Graph.zoom(1.7,1100); } }, 1800);
  }
  return did;
}
window.SallyAddDoc = addDocNode;

applyData();
setStatus("Building the knowledge graph…");

// pull in any previously uploaded docs (persistence across sessions)
try{ if(window.Sally && Sally.store) Sally.store.docs().forEach(d=> addDocNode(d, false)); }catch(e){ console.warn(e); }

// upload a PDF → extract → classify (DeepSeek or heuristic) → grow the graph
(function uploadWiring(){
  const inp=document.getElementById("pdfInput"), btn=document.getElementById("uploadBtn");
  if(!inp||!btn) return;
  btn.onclick=()=> inp.click();
  inp.onchange=async ()=>{
    const file=inp.files&&inp.files[0]; inp.value=""; if(!file) return;
    if(!(window.Sally&&Sally.Ingest)){ setStatus("Ingestion unavailable"); return; }
    btn.classList.add("busy"); setStatus(`Reading <b>${file.name}</b>…`);
    try{
      const doc=await Sally.Ingest.fromPDF(file, {onProgress:p=> setStatus(p.label||"Processing…")});
      addDocNode(doc, true);
      setStatus(`Added <b>${doc.name}</b> → SDG ${doc.goals.join(", ")} · ${doc.concepts.length} concept${doc.concepts.length>1?"s":""}`);
    }catch(e){ console.error(e); setStatus("⚠️ "+(e.message||"ingestion failed")); }
    btn.classList.remove("busy");
  };
})();

// expose for presenter scripting / verification
window.SallyGraph = Graph;
window.SallyNodes = byId;

})();

/* sliding glass nav indicator (matches the rest of the product) */
(function(){
  const nav=document.getElementById("snav"); if(!nav) return;
  const pill=document.getElementById("snavpill");
  const items=[...nav.querySelectorAll("a")];
  const home=items.find(a=>a.classList.contains("active"))||null;
  const move=el=>{ if(!el){pill.style.opacity=0;return;} pill.style.opacity=1;
    pill.style.width=el.offsetWidth+"px"; pill.style.transform=`translateX(${el.offsetLeft-4}px)`; };
  items.forEach(a=>a.addEventListener("mouseenter",()=>move(a)));
  nav.addEventListener("mouseleave",()=>move(home));
  const settle=()=>move(home); settle();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(settle);
  window.addEventListener("resize",settle); setTimeout(settle,80); setTimeout(settle,400);
})();
</script>
