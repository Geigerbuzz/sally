<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davlon Beta - Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <nav id="dock" class="floating-dock">
        <div class="dock-content">
            <a href="index.html" class="dock-item" title="Widgets">
                <i class="ri-dashboard-line"></i>
            </a>
            <a href="workspace.html" class="dock-item active" title="Workspace">
                <i class="ri-briefcase-line"></i>
            </a>
            <a href="sessions.html" class="dock-item" title="Sessions">
                <i class="ri-discuss-line"></i>
            </a>
            <a href="inbox.html" class="dock-item" title="Inbox">
                <i class="ri-mail-line"></i>
            </a>
            <a href="sources.html" class="dock-item" title="Data Sources">
                <i class="ri-database-2-line"></i>
            </a>
            <a href="settings.html" class="dock-item" title="Settings">
                <i class="ri-settings-line"></i>
            </a>
            <div class="dock-divider"></div>
            <button class="dock-item" id="theme-toggle" title="Toggle Theme">
                <i class="ri-moon-line"></i>
            </button>
        </div>
    </nav>

    <main id="content">
        <section id="workspace" class="page active" style="display: block;">
            <header
                style="display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <h1>Workspace</h1>
                    <div class="team-stack" title="Team Online">
                        <div class="avatar" style="background-color: #FF5733;">SC</div>
                        <div class="avatar" style="background-color: #33FF57;">JD</div>
                        <div class="avatar" style="background-color: #3357FF;">MK</div>
                    </div>
                </div>
            </header>
            <div class="page-content" style="position: relative; z-index: 1;">
                <div class="card">
                    <h2>Recent Files</h2>
                    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;">
                        <div
                            style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-body); border-radius: 8px;">
                            <i class="ri-file-word-2-line" style="color: #0a84ff; font-size: 24px;"></i>
                            <div>
                                <div style="font-weight: 500;">Project Alpha Proposal.docx</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">Edited 2h ago by Sarah</div>
                            </div>
                        </div>
                        <div
                            style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-body); border-radius: 8px;">
                            <i class="ri-file-excel-2-line" style="color: #32d74b; font-size: 24px;"></i>
                            <div>
                                <div style="font-weight: 500;">Q3 Budget Analysis.xlsx</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">Edited 5h ago by Mike</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
