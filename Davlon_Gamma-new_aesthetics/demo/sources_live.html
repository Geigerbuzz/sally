<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davlon Beta - Live Sources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <nav id="dock" class="floating-dock">
        <div class="dock-content">
            <a href="index.html" class="dock-item" title="Widgets"><i class="ri-dashboard-line"></i></a>
            <a href="workspace.html" class="dock-item" title="Workspace"><i class="ri-briefcase-line"></i></a>
            <a href="sessions.html" class="dock-item" title="Sessions"><i class="ri-discuss-line"></i></a>
            <a href="inbox.html" class="dock-item" title="Inbox"><i class="ri-mail-line"></i></a>
            <a href="sources.html" class="dock-item active" title="Data Sources"><i class="ri-database-2-line"></i></a>
            <a href="settings.html" class="dock-item" title="Settings"><i class="ri-settings-line"></i></a>
            <div class="dock-divider"></div>
            <button class="dock-item" id="theme-toggle" title="Toggle Theme"><i class="ri-moon-line"></i></button>
        </div>
    </nav>

    <main id="content">
        <section id="sources" class="page active">
            <canvas id="neural-bg"></canvas>
            <div class="content-wrapper">
                <header class="page-header">
                    <h1>Data & Sources</h1>
                    <div class="online-team">
                        <div class="team-bubble" style="background: #9b59b6;" title="Shay">S</div>
                        <div class="team-bubble" style="background: #3498db;" title="Mark">M</div>
                        <div class="team-bubble" style="background: #e67e22;" title="Ali">A</div>
                    </div>
                </header>

                <!-- Centered Navigation -->
                <div class="sources-nav">
                    <a href="sources.html" class="source-tab">Static</a>
                    <a href="sources_live.html" class="source-tab active">Live</a>
                    <a href="sources_legacy.html" class="source-tab">Legacy</a>
                </div>

                <!-- Live View Content -->
                <div class="source-view active">
                    <div class="card">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <h2>Active Data Streams</h2>
                            <button class="btn-primary">
                                <i class="ri-add-line"></i> Connect New
                            </button>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <div class="source-item">
                                <i class="ri-global-line" style="color: #32d74b; font-size: 20px;"></i>
                                <div style="flex: 1;">
                                    <div style="font-weight: 500;">MLS Data Stream</div>
                                    <div style="font-size: 12px; color: var(--text-secondary);">Syncing: 142ms latency
                                    </div>
                                </div>
                                <span class="status-badge active">Live</span>
                            </div>
                            <div class="source-item">
                                <i class="ri-cloud-line" style="color: #0a84ff; font-size: 20px;"></i>
                                <div style="flex: 1;">
                                    <div style="font-weight: 500;">Salesforce CRM Integration</div>
                                    <div style="font-size: 12px; color: var(--text-secondary);">Last full sync: 2 mins
                                        ago</div>
                                </div>
                                <span class="status-badge active">Healthy</span>
                            </div>
                            <div class="source-item">
                                <i class="ri-bank-card-line" style="color: #bf5af2; font-size: 20px;"></i>
                                <div style="flex: 1;">
                                    <div style="font-weight: 500;">Stripe Payments</div>
                                    <div style="font-size: 12px; color: var(--text-secondary);">Listening for webhooks
                                    </div>
                                </div>
                                <span class="status-badge active">Listening</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <script src="neurons.js"></script>
</body>

</html>
