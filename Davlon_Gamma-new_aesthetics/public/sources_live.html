<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davlon Beta - Live Sources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <nav id="dock" class="floating-dock">
        <div class="dock-content">
            <a href="index.html" class="dock-item" title="Widgets"><i class="ri-dashboard-line"></i></a>
            <a href="workspace.html" class="dock-item" title="Workspace"><i class="ri-briefcase-line"></i></a>
            <a href="sessions.html" class="dock-item" title="Sessions"><i class="ri-discuss-line"></i></a>
            <a href="inbox.html" class="dock-item" title="Inbox"><i class="ri-mail-line"></i></a>
            <a href="sources.html" class="dock-item active" title="Data Sources"><i class="ri-database-2-line"></i></a>
            <a href="settings.html" class="dock-item" title="Settings"><i class="ri-settings-line"></i></a>
            <div class="dock-divider"></div>
            <button class="dock-item" id="theme-toggle" title="Toggle Theme"><i class="ri-moon-line"></i></button>
        </div>
    </nav>

    <main id="content">
        <section id="sources" class="page active">
            <canvas id="neural-bg"></canvas>
            <div class="content-wrapper">
                <header class="page-header">
                    <h1>Data & Sources</h1>
                    <!-- Team removed -->
                </header>

                <!-- Centered Navigation -->
                <div class="sources-nav">
                    <a href="sources.html" class="source-tab">Static</a>
                    <a href="sources_live.html" class="source-tab active">Live</a>
                    <a href="sources_legacy.html" class="source-tab">Legacy</a>
                </div>

                <!-- Live View Content -->
                <div class="source-view active">
                    <!-- Connect New Source Card -->
                    <div class="card" style="padding: 24px; margin-bottom: 32px;">
                        <h2 style="margin-bottom: 16px;"><i class="ri-plug-line" style="margin-right: 8px;"></i>Connect
                            New Source</h2>
                        <div class="live-sources-grid"
                            style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                            <div class="connect-btn"
                                style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--dock-border); border-radius: 12px; cursor: pointer; transition: background 0.2s;">
                                <i class="ri-home-line" style="font-size: 20px; color: var(--accent);"></i>
                                <span>Zillow</span>
                            </div>
                            <div class="connect-btn"
                                style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--dock-border); border-radius: 12px; cursor: pointer; transition: background 0.2s;">
                                <i class="ri-home-8-line" style="font-size: 20px; color: var(--accent);"></i>
                                <span>Redfin</span>
                            </div>
                            <div class="connect-btn"
                                style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--dock-border); border-radius: 12px; cursor: pointer; transition: background 0.2s;">
                                <i class="ri-list-check-2" style="font-size: 20px; color: var(--accent);"></i>
                                <span>MLS</span>
                            </div>
                            <div class="connect-btn"
                                style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--dock-border); border-radius: 12px; cursor: pointer; transition: background 0.2s;">
                                <i class="ri-building-line" style="font-size: 20px; color: var(--accent);"></i>
                                <span>LoopNet</span>
                            </div>
                            <div class="connect-btn"
                                style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--dock-border); border-radius: 12px; cursor: pointer; transition: background 0.2s;">
                                <i class="ri-bar-chart-grouped-line" style="font-size: 20px; color: var(--accent);"></i>
                                <span>CoStar</span>
                            </div>
                            <div class="connect-btn"
                                style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--dock-border); border-radius: 12px; cursor: pointer; transition: background 0.2s;">
                                <i class="ri-add-circle-line"
                                    style="font-size: 20px; color: var(--text-secondary);"></i>
                                <span style="color: var(--text-secondary);">More...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Active Data Streams List -->
                    <h2 style="margin-bottom: 16px;"><i class="ri-radar-line" style="margin-right: 8px;"></i>Active Data
                        Streams</h2>
                    <div class="streams-list" style="max-height: 400px; overflow-y: auto;">
                        <p style="color: var(--text-secondary); font-style: italic; text-align: center; padding: 24px;">
                            No live integrations connected.
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <script src="neurons.js"></script>
</body>

</html>
