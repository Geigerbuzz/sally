<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davlon Beta - Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <nav id="dock" class="floating-dock">
        <div class="dock-content">
            <a href="index.html" class="dock-item" title="Widgets">
                <i class="ri-dashboard-line"></i>
            </a>
            <a href="workspace.html" class="dock-item active" title="Workspace">
                <i class="ri-briefcase-line"></i>
            </a>
            <a href="sessions.html" class="dock-item" title="Sessions">
                <i class="ri-discuss-line"></i>
            </a>
            <a href="inbox.html" class="dock-item" title="Inbox">
                <i class="ri-mail-line"></i>
            </a>
            <a href="sources.html" class="dock-item" title="Data Sources">
                <i class="ri-database-2-line"></i>
            </a>
            <a href="settings.html" class="dock-item" title="Settings">
                <i class="ri-settings-line"></i>
            </a>
            <div class="dock-divider"></div>
            <button class="dock-item" id="theme-toggle" title="Toggle Theme">
                <i class="ri-moon-line"></i>
            </button>
        </div>
    </nav>

    <main id="content">
        <section id="workspace" class="page active" style="display: block;">
            <div class="content-wrapper">
                <header class="page-header">
                    <h1>Workspace</h1>
                </header>

                <div class="sources-nav">
                    <a href="workspace.html" class="source-tab active">Listings</a>
                    <a href="workspace_team.html" class="source-tab">Team</a>
                    <a href="workspace_clients.html" class="source-tab">Clients</a>
                </div>

                <div class="page-content" style="position: relative; z-index: 1;">

                    <!-- Listing Grid (Dynamic) -->
                    <div class="listing-grid" id="listing-grid">
                        <!-- Loading State -->
                        <div class="listing-empty-state" id="listing-loading">
                            <i class="ri-loader-4-line"
                                style="font-size: 48px; color: var(--text-secondary); animation: spin 1s linear infinite;"></i>
                            <p style="color: var(--text-secondary); margin-top: 16px;">Loading listings...</p>
                        </div>
                    </div>

                </div>
            </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="workspace.js"></script>
</body>

</html>
