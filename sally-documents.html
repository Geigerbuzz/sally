<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — Sally</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('sally-theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="assets/sally.css">
<style>
  /* ---- toolbar ---- */
  .toolbar{display:flex; gap:12px; align-items:center; margin:0 0 14px; flex-wrap:wrap}
  .toolbar .search{flex:1; min-width:220px; max-width:380px}
  .toolbar .count{font-family:var(--mono); font-size:11px; color:var(--text-tertiary); letter-spacing:.06em; margin-left:auto}

  /* ---- concept filter chips (built on the shared .chip look) ---- */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px}
  .fchip{display:inline-flex; align-items:center; gap:7px; white-space:nowrap; cursor:pointer;
    font-size:12px; font-weight:500; color:var(--text-secondary);
    background:rgba(255,255,255,0.05); border:1px solid var(--border);
    padding:6px 12px; border-radius:var(--radius-pill); transition:.16s var(--ease)}
  [data-theme="light"] .fchip{background:rgba(0,0,0,0.03)}
  .fchip:hover{color:var(--text-primary); border-color:var(--border-2)}
  .fchip.on{color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line)}
  .fchip .pip{width:8px;height:8px;border-radius:50%; flex:none}

  /* ---- document grid + cards ---- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; padding-bottom:20px}
  .doc{padding:18px; cursor:pointer; display:flex; flex-direction:column; min-height:186px}
  .doc .top{display:flex; align-items:flex-start; gap:12px}
  .doc .fi{width:40px;height:44px;border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent); font-size:20px}
  .doc .code{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-tertiary)}
  .doc h3{font-size:16px; font-weight:600; color:var(--text-primary); margin:4px 0 0; line-height:1.25}
  .doc .meta{font-family:var(--mono); font-size:10px; letter-spacing:.04em; color:var(--text-tertiary); margin-top:6px}
  .doc p{color:var(--text-secondary); font-size:13px; line-height:1.5; margin:12px 0 0; flex:1}
  .doc .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:13px}
  .doc .sdgs{display:flex; gap:5px; margin-top:12px}
  .doc .sdgs i{width:11px;height:11px;border-radius:50%}

  /* ---- drawer page-specific bits (base .scrim/.drawer/.dh/.dbody/.blk/.dfoot live in sally.css) ---- */
  .drawer .eyebrow{margin-bottom:12px}
  .drawer h2{font-size:24px; line-height:1.18; padding-right:34px}
  .drawer .dmeta{font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:var(--text-tertiary);
    margin-top:14px; display:flex; gap:14px; flex-wrap:wrap}
  .drawer .snip{font-size:14px; color:var(--text-primary); line-height:1.6;
    border-left:2px solid var(--accent-line); padding:2px 0 2px 14px}
  .drawer .row2{display:flex; gap:9px; flex-wrap:wrap}
  .sgoal{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:rgba(255,255,255,0.03); flex:1; min-width:160px}
  [data-theme="light"] .sgoal{background:rgba(0,0,0,0.02)}
  .sgoal i{width:11px;height:11px;border-radius:50%; flex:none}
  .sgoal .nm{font-size:13px; color:var(--text-primary)}
  .sgoal .nm small{display:block; font-family:var(--mono); font-size:9px; color:var(--text-tertiary); letter-spacing:.08em; margin-top:2px}
</style>
</head>
<body>

<main class="shell">
  <div class="inner">
    <div class="page-head">
      <div class="eyebrow accent">Source corpus</div>
      <h1>Documents</h1>
      <div class="sub">Every file Sally has read — tagged with the concepts it covers and the goals it advances.</div>
    </div>

    <div class="toolbar">
      <div class="search">
        <i class="ri-search-line"></i>
        <input class="input" id="q" placeholder="Search documents, concepts, snippets…">
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="filters" id="filters"></div>

    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div class="dclose" id="dclose"><i class="ri-close-line"></i></div>
    <div class="eyebrow" id="dType"></div>
    <h2 id="dTitle"></h2>
    <div class="dmeta" id="dMeta"></div>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <a class="btn btn-accent" id="dAsk"><i class="ri-chat-3-line"></i>Ask Sally about this</a>
    <a class="btn" href="sally-knowledge-graph.html"><i class="ri-bubble-chart-line"></i>View in graph</a>
  </div>
</aside>

<script src="assets/corpus.js"></script>
<script src="assets/llm.js"></script>
<script src="assets/store.js"></script>
<script>
Sally.mountDock("documents");
const D=Sally.DOCS;
const grid=document.getElementById("grid"), countEl=document.getElementById("count");
let activeConcept=null, query="";

/* filter chips = concepts */
const filtersEl=document.getElementById("filters");
filtersEl.innerHTML = `<button class="fchip on" data-c="">All concepts</button>` +
  Object.keys(Sally.CONCEPTS).map(c=>`<button class="fchip" data-c="${c}"><span class="pip" style="background:${Sally.sdg(Sally.CONCEPTS[c].goals[0]).color}"></span>${c}</button>`).join("");
filtersEl.querySelectorAll(".fchip").forEach(b=> b.onclick=()=>{
  filtersEl.querySelectorAll(".fchip").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  activeConcept=b.dataset.c||null; render();
});

document.getElementById("q").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); render(); });

function match(d){
  if(activeConcept && !d.concepts.includes(activeConcept)) return false;
  if(!query) return true;
  return (d.name+" "+d.summary+" "+d.cite.t+" "+d.concepts.join(" ")+" "+d.code+" "+d.type).toLowerCase().includes(query);
}
function render(){
  const list=D.filter(match);
  countEl.textContent=`${list.length} of ${D.length} documents`;
  grid.innerHTML=list.map(d=>`
    <div class="card link doc" data-code="${d.code}">
      <div class="top">
        <div class="fi"><i class="ri-file-text-line"></i></div>
        <div style="min-width:0">
          <div class="code">${d.code}</div>
          <h3>${d.name}</h3>
          <div class="meta">${d.type} · ${d.pages} pp · ${d.date}</div>
        </div>
      </div>
      <p>${d.summary}</p>
      <div class="tags">${d.concepts.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
      <div class="sdgs">${d.goals.map(g=>`<i title="SDG ${g}: ${Sally.sdg(g).name}" style="background:${Sally.sdg(g).color}"></i>`).join("")}</div>
    </div>`).join("") || `<div class="faint mono" style="padding:30px">No documents match.</div>`;
  grid.querySelectorAll(".doc").forEach(el=> el.onclick=()=>open(el.dataset.code));
}

/* drawer */
const scrim=document.getElementById("scrim"), drawer=document.getElementById("drawer");
function open(code){
  const d=D.find(x=>x.code===code);
  if(!d){ history.replaceState(null,"",location.pathname); return; }
  document.getElementById("dType").textContent=d.type+" · "+d.date;
  document.getElementById("dTitle").textContent=d.name;
  document.getElementById("dMeta").innerHTML=`<span>${d.code}</span><span>${d.pages} pages</span><span>${d.concepts.length} concepts</span><span>${d.goals.length} goals</span>`;
  document.getElementById("dBody").innerHTML=`
    <div class="blk"><h4>Summary</h4><div class="muted" style="font-size:14px;line-height:1.6">${d.summary}</div></div>
    <div class="blk"><h4>Key passage · p.${d.cite.p}</h4><div class="snip">“${d.cite.t}”</div></div>
    <div class="blk"><h4>Concepts</h4><div class="row2">${d.concepts.map(c=>`<span class="chip accent">${c}</span>`).join("")}</div></div>
    <div class="blk"><h4>Advances goals</h4><div class="row2">${d.goals.map(g=>{const s=Sally.sdg(g);return `<div class="sgoal"><i style="background:${s.color}"></i><span class="nm">${s.name}<small>SDG ${g}</small></span></div>`}).join("")}</div></div>`;
  document.getElementById("dAsk").href="sally-ask.html";
  scrim.classList.add("open"); drawer.classList.add("open");
  history.replaceState(null,"","#"+code);
}
function close(){ scrim.classList.remove("open"); drawer.classList.remove("open"); history.replaceState(null,"",location.pathname); }
scrim.onclick=close; document.getElementById("dclose").onclick=close;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });

render();
if(location.hash) open(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
