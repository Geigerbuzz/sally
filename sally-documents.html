<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — Sally</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('sally-theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="assets/sally.css">
<style>
  /* category bar: tabs (left) · search + add (right) */
  .doc-bar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap}
  .doc-bar .bar-right{display:flex; align-items:center; gap:10px}
  .doc-bar .search{width:240px}
  .doc-bar .search input{padding-top:9px; padding-bottom:9px}

  /* document grid + cards */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; padding-bottom:20px}
  .doc{padding:20px; cursor:pointer; display:flex; flex-direction:column; min-height:190px}
  .doc .top{display:flex; align-items:flex-start; gap:13px}
  .doc .fi{width:40px;height:44px;border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent); font-size:20px}
  .doc .code{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-tertiary)}
  .doc h3{font-size:16px; font-weight:600; color:var(--text-primary); margin:4px 0 0; line-height:1.25}
  .doc .meta{font-family:var(--mono); font-size:10px; letter-spacing:.04em; color:var(--text-tertiary); margin-top:6px}
  .doc p{color:var(--text-secondary); font-size:13px; line-height:1.55; margin:13px 0 0; flex:1}
  .doc .sdgs{display:flex; gap:5px; margin-top:14px}
  .doc .sdgs i{width:11px;height:11px;border-radius:50%}
  .empty-note{color:var(--text-tertiary); font-family:var(--mono); font-size:12px; padding:40px 4px}

  /* drawer page-specific bits (base .scrim/.drawer/... live in sally.css) */
  .drawer .eyebrow{margin-bottom:12px}
  .drawer h2{font-size:24px; line-height:1.18; padding-right:34px}
  .drawer .dmeta{font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:var(--text-tertiary);
    margin-top:14px; display:flex; gap:14px; flex-wrap:wrap}
  .drawer .snip{font-size:14px; color:var(--text-primary); line-height:1.6;
    border-left:2px solid var(--accent-line); padding:2px 0 2px 14px}
  .drawer .row2{display:flex; gap:9px; flex-wrap:wrap}
  .sgoal{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:rgba(255,255,255,0.03); flex:1; min-width:160px}
  [data-theme="light"] .sgoal{background:rgba(0,0,0,0.02)}
  .sgoal i{width:11px;height:11px;border-radius:50%; flex:none}
  .sgoal .nm{font-size:13px; color:var(--text-primary)}
  .sgoal .nm small{display:block; font-family:var(--mono); font-size:9px; color:var(--text-tertiary); letter-spacing:.08em; margin-top:2px}

  @media (max-width:680px){ .doc-bar .search{width:100%} .doc-bar .bar-right{flex:1} }
</style>
</head>
<body>

<main class="shell">
  <div class="inner">
    <div class="page-head">
      <div class="eyebrow accent">Source corpus</div>
      <h1>Documents</h1>
      <div class="sub">Everything Sally has read — grouped by kind, searchable, and tagged with the goals it advances.</div>
    </div>

    <div class="doc-bar">
      <div class="tabs" id="tabs"></div>
      <div class="bar-right">
        <div class="search">
          <i class="ri-search-line"></i>
          <input class="input" id="q" placeholder="Search…">
        </div>
        <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
        <button class="btn btn-sm" id="uploadBtn" title="Add a PDF — Sally reads it and tags it"><i class="ri-add-line"></i> Add PDF</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div class="dclose" id="dclose"><i class="ri-close-line"></i></div>
    <div class="eyebrow" id="dType"></div>
    <h2 id="dTitle"></h2>
    <div class="dmeta" id="dMeta"></div>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <a class="btn btn-accent" id="dAsk"><i class="ri-chat-3-line"></i>Ask Sally about this</a>
    <a class="btn" href="sally-knowledge-graph.html"><i class="ri-bubble-chart-line"></i>View in graph</a>
  </div>
</aside>

<script src="assets/corpus.js"></script>
<script src="assets/llm.js"></script>
<script src="assets/store.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="assets/ingest.js"></script>
<script>
Sally.mountDock("documents");
const D=Sally.DOCS;
const grid=document.getElementById("grid");
let activeGroup="all", query="";

/* category tabs by document kind (replaces the long concept-chip row) */
const GROUPS=[
  {id:"all",        label:"All",        types:null},
  {id:"reports",    label:"Reports",    types:["Report","Review","Dashboard","Brief"]},
  {id:"policies",   label:"Policies",   types:["Policy","Charter","Code"]},
  {id:"audits",     label:"Audits",     types:["Audit"]},
  {id:"strategies", label:"Strategies", types:["Strategy"]},
  {id:"records",    label:"Records",    types:["Register","Record","Memo","Log","Upload"]},
];
const inGroup=(d,g)=> !g.types || g.types.includes(d.type);
function buildTabs(){
  const nav=document.getElementById("tabs");
  nav.innerHTML = GROUPS
    .filter(g=> g.id==="all" || D.some(d=>inGroup(d,g)))
    .map(g=>`<button class="tab" data-tab="${g.id}"><span>${g.label}</span><span class="n">${D.filter(d=>inGroup(d,g)).length}</span></button>`).join("");
  Sally.mountTabs(nav, id=>{ activeGroup=id; render(); });
}

document.getElementById("q").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); render(); });

function match(d){
  const g=GROUPS.find(x=>x.id===activeGroup);
  if(g && !inGroup(d,g)) return false;
  if(!query) return true;
  return (d.name+" "+d.summary+" "+(d.cite&&d.cite.t||"")+" "+(d.concepts||[]).join(" ")+" "+d.code+" "+d.type).toLowerCase().includes(query);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  const list=D.filter(match);
  grid.innerHTML=list.map(d=>`
    <div class="card link doc" data-code="${esc(d.code)}">
      <div class="top">
        <div class="fi"><i class="ri-file-text-line"></i></div>
        <div style="min-width:0">
          <div class="code">${esc(d.code)}</div>
          <h3>${esc(d.name)}</h3>
          <div class="meta">${esc(d.type)} · ${d.pages} pp · ${esc(d.date)}</div>
        </div>
      </div>
      <p>${esc(d.summary)}</p>
      <div class="sdgs">${(d.goals||[]).map(g=>`<i title="SDG ${g}: ${esc((Sally.sdg(g)||{}).name)}" style="background:${(Sally.sdg(g)||{}).color||'#888'}"></i>`).join("")}</div>
    </div>`).join("") || `<div class="empty-note">No documents match.</div>`;
  grid.querySelectorAll(".doc").forEach(el=> el.onclick=()=>open(el.dataset.code));
}

/* drawer */
const scrim=document.getElementById("scrim"), drawer=document.getElementById("drawer");
function open(code){
  const d=D.find(x=>x.code===code);
  if(!d){ history.replaceState(null,"",location.pathname); return; }
  document.getElementById("dType").textContent=d.type+" · "+d.date;
  document.getElementById("dTitle").textContent=d.name;
  document.getElementById("dMeta").innerHTML=`<span>${esc(d.code)}</span><span>${d.pages} pages</span><span>${(d.concepts||[]).length} concepts</span><span>${(d.goals||[]).length} goals</span>`;
  document.getElementById("dBody").innerHTML=`
    <div class="blk"><h4>Summary</h4><div class="muted" style="font-size:14px;line-height:1.6">${esc(d.summary)}</div></div>
    <div class="blk"><h4>Key passage · p.${(d.cite&&d.cite.p)||1}</h4><div class="snip">“${esc(d.cite&&d.cite.t||"")}”</div></div>
    <div class="blk"><h4>Concepts</h4><div class="row2">${(d.concepts||[]).map(c=>`<span class="chip accent">${esc(c)}</span>`).join("")}</div></div>
    <div class="blk"><h4>Advances goals</h4><div class="row2">${(d.goals||[]).map(g=>{const s=Sally.sdg(g)||{};return `<div class="sgoal"><i style="background:${s.color||'#888'}"></i><span class="nm">${esc(s.name)}<small>SDG ${g}</small></span></div>`}).join("")}</div></div>`;
  document.getElementById("dAsk").href="sally-ask.html?q="+encodeURIComponent("Summarise the "+d.name+" and which SDGs it supports.");
  scrim.classList.add("open"); drawer.classList.add("open");
  history.replaceState(null,"","#"+code);
}
function close(){ scrim.classList.remove("open"); drawer.classList.remove("open"); history.replaceState(null,"",location.pathname); }
scrim.onclick=close; document.getElementById("dclose").onclick=close;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });

buildTabs();
render();
if(location.hash) open(decodeURIComponent(location.hash.slice(1)));

/* upload a PDF → ingest (DeepSeek or heuristic) → appears in the library + graph */
(function(){
  const inp=document.getElementById("pdfInput"), btn=document.getElementById("uploadBtn");
  if(!inp||!btn) return;
  btn.onclick=()=> inp.click();
  inp.onchange=async ()=>{
    const file=inp.files&&inp.files[0]; inp.value=""; if(!file || !(window.Sally&&Sally.Ingest)) return;
    const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<i class="ri-loader-4-line spin"></i> Reading…`;
    try{
      const doc=await Sally.Ingest.fromPDF(file,{onProgress:p=>{ btn.innerHTML=`<i class="ri-loader-4-line spin"></i> ${(p.label||"Processing").replace(/…$/,"")}…`; }});
      buildTabs(); render(); open(doc.code);
    }catch(e){ alert("Couldn't ingest that PDF: "+e.message); }
    btn.disabled=false; btn.innerHTML=orig;
  };
})();
</script>
</body>
</html>
