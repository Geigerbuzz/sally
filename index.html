<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sally — SDG Command Center</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('sally-theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="assets/sally.css">
<style>
  .shell{ position:relative; z-index:1 }          /* content floats above the animated backdrop */
  #widget-grid{ background-image:none }            /* the frosted colour field is the texture */
  .dash-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:6px }
  .dash-head h1{ margin-top:9px; font-size:36px; font-weight:600; letter-spacing:-0.028em; line-height:1.05 }
  .dash-head .sub{ color:var(--text-secondary); margin-top:9px; font-size:16px; max-width:58ch; line-height:1.5 }
  .dash-actions{ display:flex; align-items:center; gap:12px }
  @media (max-width:760px){ .dash-actions{ width:100%; justify-content:space-between } }
</style>
</head>
<body>

<main class="shell">
  <div class="inner">
    <div class="dash-head">
      <div>
        <div class="eyebrow accent">SDG Command Center</div>
        <h1 id="greeting">Welcome back</h1>
        <div class="sub" id="subline">Live sustainability coverage across the 17 UN Sustainable Development Goals.</div>
      </div>
      <div class="dash-actions">
        <button class="btn btn-sm" id="auto-arrange" title="Tidy the widgets"><i class="ri-apps-2-line"></i> Arrange</button>
      </div>
    </div>

    <div class="widget-grid" id="widget-grid"></div>
  </div>
</main>

<!-- add-widget FAB + offline AI modal -->
<button class="fab" id="add-widget" title="Add a widget"><i class="ri-add-line"></i></button>
<div class="modal-overlay" id="ai-overlay">
  <div class="ai-modal">
    <div class="ai-header">
      <button class="ai-close" title="Close"><i class="ri-close-line"></i></button>
      <h2>Add a widget</h2>
      <button class="ai-generate"><i class="ri-sparkling-2-line"></i> Generate</button>
    </div>
    <textarea class="ai-input" placeholder="Describe a widget — e.g. “emissions by year”, “top SDGs”, “gender pay gap”…"></textarea>
    <div class="ai-suggest">
      <span class="chip">Emissions by year</span>
      <span class="chip">Energy mix</span>
      <span class="chip">Top SDGs</span>
      <span class="chip">Coverage gaps</span>
      <span class="chip">Gender pay gap</span>
      <span class="chip">Document table</span>
    </div>
  </div>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script src="assets/corpus.js"></script>
<script src="assets/llm.js"></script>
<script src="assets/store.js"></script>
<script src="assets/widgets.js"></script>
<script src="assets/dashboard.js"></script>
<script>
  Sally.mountDock("dashboard");
  (function(){
    const h = new Date().getHours();
    const part = h<12 ? "Good morning" : h<18 ? "Good afternoon" : "Good evening";
    document.getElementById("greeting").textContent = `${part} — ${Sally.company.name}`;
    document.getElementById("subline").textContent =
      `Live sustainability coverage across the 17 UN Sustainable Development Goals, scored from ${Sally.company.name}'s ${Sally.DOCS.length} documents.`;
  })();
</script>
</body>
</html>
