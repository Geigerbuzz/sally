<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDG Compliance — Sally</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="assets/sally.css">
<style>
  .head{position:relative; z-index:1; padding:34px 0 6px}
  .head .eyebrow{margin-bottom:12px}
  .head h1{font-size:34px}
  .head .sub{color:var(--muted); margin-top:8px; font-size:15px; max-width:64ch}

  /* summary band */
  .summary{position:relative; z-index:1; display:grid; grid-template-columns:auto 1fr; gap:34px; align-items:center;
    margin:26px 0 30px; padding:26px; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-lg)}
  .gauge{width:150px;height:150px; position:relative; flex:none}
  .gauge .pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .gauge .pct b{font-family:var(--display); font-weight:800; font-size:38px; letter-spacing:-0.02em; line-height:1}
  .gauge .pct span{font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin-top:5px}
  .sumstats{display:grid; grid-template-columns:repeat(4,1fr); gap:18px}
  .sumstat .n{font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-0.02em}
  .sumstat .n.strong{color:#56C02B} .sumstat .n.gap{color:#E5243B} .sumstat .n.acc{color:var(--accent-3)}
  .sumstat .l{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-top:6px}
  .sumstat p{font-size:12.5px; color:var(--muted); margin:9px 0 0; line-height:1.5}

  /* grid of 17 */
  .gtitle{position:relative; z-index:1; display:flex; align-items:center; gap:12px; margin:6px 0 16px}
  .gtitle .eyebrow{color:var(--faint)} .gtitle .ln{flex:1; height:1px; background:var(--line)}
  .sdgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:14px; position:relative; z-index:1; padding-bottom:80px}
  .tile{padding:16px; cursor:pointer; position:relative; overflow:hidden}
  .tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c)}
  .tile.gap{opacity:.62}
  .tile .th{display:flex; align-items:center; gap:11px}
  .tile .badge{width:38px;height:38px;border-radius:9px; flex:none; display:flex;align-items:center;justify-content:center;
    font-family:var(--display); font-weight:800; font-size:16px; color:#fff; background:var(--c);
    box-shadow:0 4px 14px -4px var(--c)}
  .tile .nm{font-family:var(--body); font-weight:600; font-size:14.5px; line-height:1.2}
  .tile .full{font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--faint); margin-top:3px}
  .tile .status{margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    padding:4px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; align-self:flex-start}
  .tile .status.Strong{color:#7fd36a; border-color:rgba(86,192,43,.4); background:rgba(86,192,43,.1)}
  .tile .status.Gap{color:#f08fa0; border-color:rgba(229,36,59,.4); background:rgba(229,36,59,.1)}
  .tile .barrow{display:flex; align-items:center; gap:10px; margin-top:16px}
  .tile .bar{flex:1} .tile .bar > i{background:var(--c); box-shadow:0 0 10px -2px var(--c)}
  .tile .pctn{font-family:var(--mono); font-size:11px; color:var(--text); min-width:34px; text-align:right}
  .tile .ev{font-family:var(--mono); font-size:9.5px; color:var(--faint); margin-top:11px; letter-spacing:.04em}

  /* drawer (shared look) */
  .scrim{position:fixed; inset:0; z-index:70; background:rgba(4,5,8,0.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.3s}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; z-index:71; top:0; right:0; height:100%; width:452px; max-width:92vw; background:var(--panel);
    border-left:1px solid var(--line); backdrop-filter:blur(16px); transform:translateX(104%);
    transition:transform .42s cubic-bezier(.22,.61,.36,1); display:flex; flex-direction:column; box-shadow:-30px 0 80px rgba(0,0,0,.5)}
  .drawer.open{transform:none}
  .drawer .dh{padding:26px; border-bottom:1px solid var(--line); position:relative}
  .drawer .dclose{position:absolute; top:20px; right:20px; width:30px;height:30px;border-radius:8px; cursor:pointer;
    display:flex;align-items:center;justify-content:center; color:var(--faint); border:1px solid var(--line); background:rgba(255,255,255,.03)}
  .drawer .dclose:hover{color:var(--text)}
  .drawer .dtop{display:flex; align-items:center; gap:14px}
  .drawer .dbadge{width:54px;height:54px;border-radius:12px; flex:none; display:flex;align-items:center;justify-content:center;
    font-family:var(--display); font-weight:800; font-size:22px; color:#fff}
  .drawer .deyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
  .drawer h2{font-size:23px; line-height:1.16; margin-top:4px}
  .drawer .dscore{margin-top:18px}
  .drawer .dscore .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .drawer .dscore .row b{font-family:var(--display); font-weight:800; font-size:20px}
  .drawer .dbody{padding:22px 26px 26px; overflow-y:auto; flex:1}
  .drawer .blk{margin-bottom:24px}
  .drawer .blk h4{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0 0 12px;
    display:flex; gap:8px} .drawer .blk h4 .c{color:var(--faint-2)}
  .evd{border:1px solid var(--line); border-radius:11px; padding:13px; margin-bottom:10px; background:rgba(255,255,255,.02); cursor:pointer; transition:.15s}
  .evd:hover{border-color:var(--accent-line); background:var(--accent-soft)}
  .evd .nm{font-weight:600; font-size:13.5px; color:var(--text)}
  .evd .meta{font-family:var(--mono); font-size:9.5px; color:var(--faint); margin:3px 0 8px}
  .evd .snip{font-size:12.3px; color:var(--muted); line-height:1.5; border-left:2px solid var(--cc,var(--accent-line)); padding-left:10px}
  .drawer .gapnote{font-size:13.5px; color:var(--muted); line-height:1.6; padding:14px; border:1px dashed var(--line-2); border-radius:11px}
  .drawer .dfoot{padding:16px 26px; border-top:1px solid var(--line); display:flex; gap:10px}
  .drawer .dfoot .btn{flex:1; justify-content:center}

  @media (max-width:760px){ .summary{grid-template-columns:1fr} .sumstats{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="backdrop"></div>
<header id="topbar"></header>

<main class="wrap">
  <div class="head">
    <div class="eyebrow accent">UN Sustainable Development Goals</div>
    <h1>SDG Compliance</h1>
    <div class="sub">How <b id="co"></b> measures up against each of the 17 goals — scored from the evidence Sally found across the document corpus. Click any goal for its supporting sources.</div>
  </div>

  <section class="summary">
    <div class="gauge" id="gauge"></div>
    <div class="sumstats" id="sumstats"></div>
  </section>

  <div class="gtitle"><span class="eyebrow">All 17 goals</span><span class="ln"></span><span class="eyebrow" id="sortnote">sorted by coverage</span></div>
  <div class="sdgrid" id="grid"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div class="dclose" id="dclose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
    <div class="dtop">
      <div class="dbadge" id="dBadge"></div>
      <div><div class="deyebrow" id="dEyebrow"></div><h2 id="dTitle"></h2></div>
    </div>
    <div class="dscore" id="dScore"></div>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <a class="btn" href="sally-knowledge-graph.html"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="12" cy="17" r="2"/><path d="M7.7 7.4 10.6 15M16.6 8.6 13.4 15.4"/></svg>Spotlight in graph</a>
    <a class="btn" href="sally-ask.html">Ask Sally</a>
  </div>
</aside>

<script src="assets/corpus.js"></script>
<script>
Sally.mountNav("compliance");
document.getElementById("co").textContent=Sally.company.name;
const ov=Sally.overallScore();

/* gauge ring */
(function(){
  const r=64, c=2*Math.PI*r, off=c*(1-ov.pct/100);
  document.getElementById("gauge").innerHTML=`
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="11"/>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 75 75)" id="ring"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6f6bff"/><stop offset="1" stop-color="#4841ff"/></linearGradient></defs>
    </svg>
    <div class="pct"><b>${ov.pct}<span style="font-size:20px">%</span></b><span>Overall</span></div>`;
  requestAnimationFrame(()=>{ const ring=document.getElementById("ring"); ring.style.transition="stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1)"; ring.style.strokeDashoffset=off; });
})();

const strongCount=Sally.SDG.filter(g=>Sally.scoreForGoal(g.n).status==="Strong").length;
document.getElementById("sumstats").innerHTML=[
  {n:ov.covered+"/17", l:"Goals with evidence", cls:"acc", p:"Goals backed by at least one source document."},
  {n:strongCount, l:"Rated strong", cls:"strong", p:"Goals with deep, multi-source coverage."},
  {n:ov.gaps, l:"Coverage gaps", cls:"gap", p:"Goals with no supporting evidence yet."},
  {n:Sally.DOCS.length, l:"Documents assessed", cls:"", p:"Total sources in the corpus Sally scored."},
].map(s=>`<div class="sumstat"><div class="n ${s.cls}">${s.n}</div><div class="l">${s.l}</div><p>${s.p}</p></div>`).join("");

/* tiles, sorted by coverage desc */
const grid=document.getElementById("grid");
const rows=Sally.SDG.map(g=>({g, sc:Sally.scoreForGoal(g.n)})).sort((a,b)=>b.sc.pct-a.sc.pct);
grid.innerHTML=rows.map(({g,sc})=>`
  <div class="card link tile ${sc.status==='Gap'?'gap':''}" style="--c:${g.color}" data-n="${g.n}">
    <div class="th">
      <div class="badge">${g.n}</div>
      <div style="min-width:0"><div class="nm">${g.short}</div><div class="full">SDG ${g.n}</div></div>
      <div class="status ${sc.status}">${sc.status}</div>
    </div>
    <div class="barrow"><div class="bar"><i style="width:${sc.pct}%"></i></div><div class="pctn">${sc.pct}%</div></div>
    <div class="ev">${sc.docs} evidence doc${sc.docs!==1?'s':''} · ${sc.concepts} concept${sc.concepts!==1?'s':''}</div>
  </div>`).join("");
grid.querySelectorAll(".tile").forEach(el=> el.onclick=()=>open(+el.dataset.n));

/* drawer */
const scrim=document.getElementById("scrim"), drawer=document.getElementById("drawer");
function open(n){
  const g=Sally.sdg(n), sc=Sally.scoreForGoal(n);
  const docs=Sally.docsForGoal(n), concepts=Sally.conceptsForGoal(n);
  document.getElementById("dBadge").style.background=g.color;
  document.getElementById("dBadge").textContent=n;
  document.getElementById("dEyebrow").textContent="Sustainable Development Goal "+n;
  document.getElementById("dTitle").textContent=g.name;
  document.getElementById("dScore").innerHTML=`
    <div class="row"><span class="eyebrow" style="color:var(--faint)">Coverage · ${sc.status}</span><b style="color:${g.color}">${sc.pct}%</b></div>
    <div class="bar"><i style="width:${sc.pct}%; background:${g.color}; box-shadow:0 0 10px -2px ${g.color}"></i></div>`;
  let body="";
  if(docs.length){
    body+=`<div class="blk"><h4>Evidence documents <span class="c">· ${docs.length}</span></h4>${
      docs.map(d=>`<div class="evd" data-code="${d.code}" style="--cc:${g.color}66">
        <div class="nm">${d.name}</div>
        <div class="meta">${d.code} · p.${d.cite.p} · ${d.type}</div>
        <div class="snip">“${d.cite.t}”</div></div>`).join("")}</div>`;
  } else {
    body+=`<div class="blk"><h4>Evidence documents</h4>
      <div class="gapnote">No documents in the current corpus provide evidence for this goal. This is a visible coverage gap —
      adding a relevant report or policy would let Sally score it.</div></div>`;
  }
  body+=`<div class="blk"><h4>Related concepts <span class="c">· ${concepts.length}</span></h4>
    <div class="row" style="flex-wrap:wrap; gap:8px">${concepts.length?concepts.map(c=>`<span class="chip accent">${c}</span>`).join(""):'<span class="faint mono" style="font-size:11px">none</span>'}</div></div>`;
  document.getElementById("dBody").innerHTML=body;
  document.getElementById("dBody").querySelectorAll(".evd").forEach(el=> el.onclick=()=>location.href="sally-documents.html#"+el.dataset.code);
  scrim.classList.add("open"); drawer.classList.add("open");
}
function close(){ scrim.classList.remove("open"); drawer.classList.remove("open"); }
scrim.onclick=close; document.getElementById("dclose").onclick=close;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
</script>
</body>
</html>
