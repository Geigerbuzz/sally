<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDG Compliance — Sally</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('sally-theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="assets/sally.css">
<style>
  /* ---- page head ---- */
  .head{ margin-bottom:8px }
  .head .eyebrow{ margin-bottom:12px }
  .head .sub{ color:var(--text-secondary); margin-top:10px; font-size:15px; max-width:66ch; line-height:1.55 }

  /* ---- summary band ---- */
  .summary{ display:grid; grid-template-columns:auto 1fr; gap:34px; align-items:center;
    margin:22px 0 30px; padding:26px;
    background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-1) }
  .gauge{ width:150px; height:150px; position:relative; flex:none }
  .gauge .pct{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center }
  .gauge .pct b{ font-weight:700; font-size:38px; letter-spacing:-0.02em; line-height:1; color:var(--text-primary) }
  .gauge .pct span{ font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-tertiary); margin-top:6px }
  .sumstats{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px }
  .sumstat .n{ font-weight:700; font-size:30px; letter-spacing:-0.02em; line-height:1; color:var(--text-primary) }
  .sumstat .n.acc{ color:var(--accent) }
  .sumstat .n.strong{ color:var(--good) }
  .sumstat .n.gap{ color:var(--bad) }
  .sumstat .l{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-tertiary); margin-top:8px }
  .sumstat p{ font-size:12.5px; color:var(--text-secondary); margin:9px 0 0; line-height:1.5 }

  /* ---- "All 17 goals" header ---- */
  .gtitle{ display:flex; align-items:center; gap:12px; margin:6px 0 16px }
  .gtitle .ln{ flex:1; height:1px; background:var(--hairline) }

  /* ---- grid of 17 tiles ---- */
  .sdgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:14px; padding-bottom:24px }
  .tile{ padding:16px; cursor:pointer; position:relative; overflow:hidden }
  .tile::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c) }
  .tile.gap{ opacity:.8 }
  .tile.gap::before{ background:repeating-linear-gradient(180deg, var(--c) 0 6px, transparent 6px 11px); opacity:.55 }
  .tile.gap .badge{ box-shadow:none; filter:saturate(.72) }
  .tile .th{ display:flex; align-items:flex-start; gap:11px }
  .tile .badge{ width:38px; height:38px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#fff; background:var(--c); box-shadow:0 4px 14px -4px var(--c) }
  .tile .nm{ font-weight:600; font-size:15px; line-height:1.2; color:var(--text-primary) }
  .tile .full{ font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); margin-top:4px }
  .tile .status-pill{ margin-left:auto; align-self:flex-start }
  .tile .barrow{ display:flex; align-items:center; gap:10px; margin-top:16px }
  .tile .bar{ flex:1 }
  .tile .bar > i{ background:var(--c) }
  .tile .pctn{ font-family:var(--mono); font-size:11px; color:var(--text-secondary); min-width:34px; text-align:right }
  .tile .ev{ font-family:var(--mono); font-size:9.5px; color:var(--text-tertiary); margin-top:11px; letter-spacing:.04em }

  /* ---- drawer (page-specific content; shell from sally.css) ---- */
  .drawer .dtop{ display:flex; align-items:center; gap:14px }
  .drawer .dbadge{ width:54px; height:54px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:22px; color:#fff }
  .drawer .deyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-tertiary) }
  .drawer h2{ font-size:23px; line-height:1.16; margin-top:4px }
  .drawer .dscore{ margin-top:18px }
  .drawer .dscore .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px }
  .drawer .dscore .row b{ font-weight:700; font-size:20px }
  .drawer .blk h4{ display:flex; gap:8px }
  .drawer .blk h4 .c{ color:var(--text-secondary) }
  .evd{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px; margin-bottom:10px;
    background:rgba(255,255,255,.02); cursor:pointer; transition:.16s var(--ease) }
  [data-theme="light"] .evd{ background:rgba(0,0,0,.02) }
  .evd:hover{ border-color:var(--accent-line); background:var(--accent-soft); transform:translateY(-2px) }
  .evd .nm{ font-weight:600; font-size:13.5px; color:var(--text-primary) }
  .evd .meta{ font-family:var(--mono); font-size:9.5px; color:var(--text-tertiary); margin:3px 0 8px }
  .evd .snip{ font-size:12.3px; color:var(--text-secondary); line-height:1.5;
    border-left:2px solid var(--cc,var(--accent-line)); padding-left:10px }
  .drawer .gapnote{ font-size:13.5px; color:var(--text-secondary); line-height:1.6; padding:14px;
    border:1px dashed var(--border-2); border-radius:var(--radius-sm) }

  @media (max-width:760px){ .summary{ grid-template-columns:1fr } .sumstats{ grid-template-columns:repeat(2,1fr) } }
</style>
</head>
<body>
<main class="shell">
 <div class="inner">
  <div class="head page-head">
    <div class="eyebrow accent">UN Sustainable Development Goals</div>
    <h1>SDG Compliance</h1>
    <div class="sub">How <b id="co"></b> measures up against each of the 17 goals — scored from the evidence Sally found across the document corpus. Click any goal for its supporting sources.</div>
  </div>

  <section class="summary">
    <div class="gauge" id="gauge"></div>
    <div class="sumstats" id="sumstats"></div>
  </section>

  <div class="gtitle"><span class="eyebrow">All 17 goals</span><span class="ln"></span><span class="eyebrow" id="sortnote">sorted by coverage</span></div>
  <div class="sdgrid" id="grid"></div>
 </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div class="dclose" id="dclose" aria-label="Close"><i class="ri-close-line"></i></div>
    <div class="dtop">
      <div class="dbadge" id="dBadge"></div>
      <div><div class="deyebrow" id="dEyebrow"></div><h2 id="dTitle"></h2></div>
    </div>
    <div class="dscore" id="dScore"></div>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <a class="btn" href="sally-knowledge-graph.html"><i class="ri-bubble-chart-line"></i>Spotlight in graph</a>
    <a class="btn btn-accent" href="sally-ask.html"><i class="ri-chat-3-line"></i>Ask Sally</a>
  </div>
</aside>

<script src="assets/corpus.js"></script>
<script src="assets/llm.js"></script>
<script src="assets/store.js"></script>
<script>
Sally.mountDock("compliance");
document.getElementById("co").textContent=Sally.company.name;
const ov=Sally.overallScore();

/* gauge ring — matches the dashboard gauge: r=64, sw=11, gradient #5ab0ff -> accent */
(function(){
  const r=64, c=2*Math.PI*r, off=c*(1-ov.pct/100);
  document.getElementById("gauge").innerHTML=`
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(128,128,128,.18)" stroke-width="11"/>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="url(#gaugeGrad)" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 75 75)" id="ring"/>
      <defs><linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5ab0ff"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>
    </svg>
    <div class="pct"><b>${ov.pct}<span style="font-size:20px">%</span></b><span>Overall</span></div>`;
  requestAnimationFrame(()=>{ const ring=document.getElementById("ring"); ring.style.transition="stroke-dashoffset 1.1s var(--ease)"; ring.style.strokeDashoffset=off; });
})();

const strongCount=Sally.SDG.filter(g=>Sally.scoreForGoal(g.n).status==="Strong").length;
document.getElementById("sumstats").innerHTML=[
  {n:ov.covered+"/17", l:"Goals with evidence", cls:"acc", p:"Goals backed by at least one source document."},
  {n:strongCount, l:"Rated strong", cls:"strong", p:"Goals with deep, multi-source coverage."},
  {n:ov.gaps, l:"Coverage gaps", cls:"gap", p:"Goals with no supporting evidence yet."},
  {n:Sally.DOCS.length, l:"Documents assessed", cls:"", p:"Total sources in the corpus Sally scored."},
].map(s=>`<div class="sumstat"><div class="n ${s.cls}">${s.n}</div><div class="l">${s.l}</div><p>${s.p}</p></div>`).join("");

/* tiles, sorted by coverage desc */
const grid=document.getElementById("grid");
const rows=Sally.SDG.map(g=>({g, sc:Sally.scoreForGoal(g.n)})).sort((a,b)=>b.sc.pct-a.sc.pct);
grid.innerHTML=rows.map(({g,sc})=>`
  <div class="card link tile ${sc.status==='Gap'?'gap':''}" style="--c:${g.color}" data-n="${g.n}">
    <div class="th">
      <div class="badge">${g.n}</div>
      <div style="min-width:0"><div class="nm">${g.short}</div><div class="full">SDG ${g.n}</div></div>
      <span class="status-pill ${sc.status}">${sc.status}</span>
    </div>
    <div class="barrow"><div class="bar"><i style="width:${sc.pct}%"></i></div><div class="pctn">${sc.pct}%</div></div>
    <div class="ev">${sc.docs} evidence doc${sc.docs!==1?'s':''} · ${sc.concepts} concept${sc.concepts!==1?'s':''}</div>
  </div>`).join("");
grid.querySelectorAll(".tile").forEach(el=> el.onclick=()=>open(+el.dataset.n));

/* drawer */
const scrim=document.getElementById("scrim"), drawer=document.getElementById("drawer");
function open(n){
  const g=Sally.sdg(n), sc=Sally.scoreForGoal(n);
  const docs=Sally.docsForGoal(n), concepts=Sally.conceptsForGoal(n);
  document.getElementById("dBadge").style.background=g.color;
  document.getElementById("dBadge").textContent=n;
  document.getElementById("dEyebrow").textContent="Sustainable Development Goal "+n;
  document.getElementById("dTitle").textContent=g.name;
  document.getElementById("dScore").innerHTML=`
    <div class="row"><span class="eyebrow grow">Coverage · ${sc.status}</span><b style="color:${g.color}">${sc.pct}%</b></div>
    <div class="bar"><i style="width:${sc.pct}%; background:${g.color}"></i></div>`;
  let body="";
  if(docs.length){
    body+=`<div class="blk"><h4>Evidence documents <span class="c">· ${docs.length}</span></h4>${
      docs.map(d=>`<div class="evd" data-code="${d.code}" style="--cc:${g.color}66">
        <div class="nm">${d.name}</div>
        <div class="meta">${d.code} · p.${d.cite.p} · ${d.type}</div>
        <div class="snip">“${d.cite.t}”</div></div>`).join("")}</div>`;
  } else {
    body+=`<div class="blk"><h4>Evidence documents</h4>
      <div class="gapnote">No documents in the current corpus provide evidence for this goal. This is a visible coverage gap —
      adding a relevant report or policy would let Sally score it.</div></div>`;
  }
  body+=`<div class="blk"><h4>Related concepts <span class="c">· ${concepts.length}</span></h4>
    <div class="row" style="flex-wrap:wrap; gap:8px">${concepts.length?concepts.map(c=>`<span class="chip accent">${c}</span>`).join(""):'<span class="faint mono" style="font-size:11px">none</span>'}</div></div>`;
  document.getElementById("dBody").innerHTML=body;
  document.getElementById("dBody").querySelectorAll(".evd").forEach(el=> el.onclick=()=>location.href="sally-documents.html#"+el.dataset.code);
  scrim.classList.add("open"); drawer.classList.add("open");
}
function close(){ scrim.classList.remove("open"); drawer.classList.remove("open"); }
scrim.onclick=close; document.getElementById("dclose").onclick=close;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });

/* deep-link: ?goal=N auto-opens that goal's drawer (dashboard SDG-grid + gap-list links) */
(function(){
  const g=parseInt(new URLSearchParams(location.search).get("goal"),10);
  if(g>=1 && g<=17) open(g);
})();
</script>
</body>
</html>
